<style>
/* La guerra degli Eroi — stile della pagina (usa le variabili «Ametista» di tempio.css) */
.er-top{margin-top:18px;display:grid;gap:14px}
.er-who{display:flex;gap:14px;align-items:center;min-width:0}
.er-pic{width:64px;height:64px;border-radius:50%;flex:none;display:grid;place-items:center;background:var(--raise);border:2px solid var(--ac);font:700 1.7rem var(--disp);color:var(--ac2);box-shadow:0 0 22px rgba(var(--ac-rgb),.3);overflow:hidden}
.er-who h2{font-size:1.35rem;overflow-wrap:anywhere}
.er-lv{color:var(--mu);font-size:.92rem;margin-top:2px}
.er-lv b{color:var(--ac2);font-family:var(--disp)}
.er-bc{margin-left:auto;text-align:right;flex:none}.er-bc b{display:block;font:700 1.25rem var(--disp);color:var(--gold);font-variant-numeric:tabular-nums}.er-bc span{font-size:.78rem;color:var(--mu)}
.er-xp{height:10px;border-radius:9px;background:var(--inp);border:1px solid var(--line);overflow:hidden}.er-xp i{display:block;height:100%;background:linear-gradient(90deg,var(--bar-a),var(--ac2))}
.er-xpt{display:flex;justify-content:space-between;font-size:.8rem;color:var(--mu);margin-top:4px}
.er-reset{font-size:.88rem;color:var(--mu)}.er-reset b{color:var(--tx);font-variant-numeric:tabular-nums}
.er-gate{text-align:center;padding:22px 16px}.er-gate h2{font-size:1.3rem;margin-bottom:8px}
.er-msg{margin:14px 0 0;padding:11px 13px;border-radius:12px;border:1px solid var(--ac);background:rgba(var(--ac-rgb),.12);font-weight:600;overflow-wrap:anywhere}
.er-msg.bad{border-color:var(--bad);background:rgba(255,84,104,.1);color:#ffb3bd}
.er-msg.good{border-color:var(--good);background:rgba(74,222,155,.1);color:#b4f5d4}
.er-h{font-size:1.15rem;margin:26px 0 10px}.er-h:first-child{margin-top:0}
.er-sub{color:var(--mu);font-size:.92rem;margin:-4px 0 12px}
/* statistiche */
.er-st{display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.er-st:first-of-type{border-top:0}
.er-st .nm{font-weight:700}.er-st .nm small{display:block;color:var(--mu);font-weight:400;font-size:.82rem}
.er-st .val{font:700 1.3rem var(--disp);font-variant-numeric:tabular-nums;text-align:right;color:var(--ac2)}.er-st .val em{font:600 .78rem var(--ui);color:var(--good);font-style:normal;margin-left:4px}
.er-ctl{grid-column:1/-1;display:flex;align-items:center;gap:10px}

.er-pts{flex:1;display:flex;gap:3px}.er-pts i{flex:1;height:14px;border-radius:4px;background:var(--inp);border:1px solid var(--line)}.er-pts i.on{background:linear-gradient(180deg,var(--ac2),var(--ac));border-color:var(--ac)}

.er-note{color:var(--mu);font-size:.88rem;margin:8px 0 0}

.er-ic{width:44px;height:44px;border-radius:10px;display:grid;place-items:center;font-size:1.5rem;background:var(--raise);border:1.5px solid var(--rc,var(--line))}
.er-sl small{display:block;color:var(--mu);font-size:.76rem;text-transform:uppercase;letter-spacing:.05em}
.er-nm{font-weight:700;overflow-wrap:anywhere;color:var(--rc,var(--tx))}
.er-bn{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}.er-bn span{font-size:.74rem;font-weight:700;padding:1px 7px;border-radius:99px;border:1px solid var(--line);color:var(--ac2);background:rgba(var(--ac-rgb),.08)}
.er-bn span.sp{color:var(--gold);border-color:rgba(232,184,74,.45);background:rgba(232,184,74,.08)}
.r-base{--rc:#9ca3b8}.r-comune{--rc:#c3c8d8}.r-non_comune{--rc:#4ade9b}.r-raro{--rc:#6cb6ff}.r-epico{--rc:#c084fc}.r-leggendario{--rc:#f5b942}.r-mitico{--rc:#ff6b9d}
.er-rar{font-size:.72rem;font-weight:700;color:var(--rc,var(--mu));text-transform:uppercase;letter-spacing:.05em}
.er-inv{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.er-inv .btn{min-height:44px;padding:0 14px;font-size:.92rem}
/* boss */
.er-boss{display:grid;gap:14px}
.er-bh{display:flex;gap:14px;align-items:center}
.er-sig{width:84px;height:84px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:2.8rem;background:radial-gradient(circle at 35% 30%,hsl(var(--h) 70% 40%),hsl(var(--h) 60% 12%) 70%);border:2px solid hsl(var(--h) 80% 65%);box-shadow:0 0 28px hsl(var(--h) 80% 55% / .45)}
.er-bh h2{font-size:1.35rem;overflow-wrap:anywhere}.er-bh small{color:var(--mu)}
.er-lore{color:var(--mu);font-size:.95rem;margin:0}.er-trait{margin:0;font-size:.9rem}.er-trait b{color:var(--gold)}
.er-hp{height:22px;border-radius:99px;background:var(--inp);border:1px solid var(--line);overflow:hidden;position:relative}
.er-hp i{display:block;height:100%;background:linear-gradient(90deg,#b4233a,var(--bad));transition:width .4s}
.er-hp span{position:absolute;inset:0;display:grid;place-items:center;font:700 .8rem var(--ui);text-shadow:0 1px 2px #000;font-variant-numeric:tabular-nums}
.er-hp.me i{background:linear-gradient(90deg,#1f9d63,var(--good))}.er-hp.sm{height:14px}.er-hp.sm span{font-size:.68rem}
.er-chips{display:flex;flex-wrap:wrap;gap:8px}.er-chips span{padding:3px 10px;border-radius:99px;border:1px solid var(--line);font-size:.85rem;font-weight:600;background:var(--inp)}
.er-acts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.er-acts button{display:flex;flex-direction:column;align-items:flex-start;gap:2px;min-height:78px;padding:10px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--surf);color:var(--tx);font:700 1rem var(--ui);text-align:left;cursor:pointer}
.er-acts button small{font-weight:400;color:var(--mu);font-size:.8rem;line-height:1.25}
.er-acts button:hover:not(:disabled){border-color:var(--ac);background:rgba(var(--ac-rgb),.08)}
.er-acts button:disabled{opacity:.4;cursor:not-allowed}
.er-acts .atk{border-color:rgba(255,84,104,.55)}.er-acts .grd{border-color:rgba(108,182,255,.55)}.er-acts .hel{border-color:rgba(74,222,155,.5)}.er-acts .stu{border-color:rgba(255,209,102,.5)}

.er-sel{display:flex;gap:8px;align-items:center;margin-top:10px}.er-sel select{min-height:44px}
.er-win{border-color:var(--gold);box-shadow:0 0 26px rgba(232,184,74,.2)}.er-win h3{color:var(--gold);font-size:1.2rem}

.er-ar{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}

.er-ar small{display:block;color:var(--mu);font-size:.8rem}
.er-sw{display:flex;align-items:center;gap:12px;min-height:48px}.er-sw span{flex:1}
/* mercante */
.er-shop{display:grid;gap:12px}@media(min-width:620px){.er-shop{grid-template-columns:1fr 1fr}}
.er-it{display:grid;gap:8px;padding:12px;border:1px solid var(--line);border-left:3px solid var(--rc,var(--line));border-radius:12px;background:var(--surf);min-width:0}
.er-it .hd{display:grid;grid-template-columns:44px 1fr;gap:10px;align-items:center}
.er-pr{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}.er-pr b{font:700 1.2rem var(--disp);color:var(--gold);font-variant-numeric:tabular-nums}.er-pr s{color:var(--mu);font-size:.9rem}
.er-tag{font-size:.72rem;font-weight:700;padding:1px 8px;border-radius:99px;background:var(--bad);color:#1a0509}
.er-lock{color:var(--bad);font-size:.85rem;font-weight:600}
/* classifica */
.er-lb{display:grid;grid-template-columns:38px 34px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.er-lb .rk{font:700 1.1rem var(--disp);color:var(--ac2);text-align:center}.er-lb.me{background:rgba(var(--ac-rgb),.08)}
.er-lb small{display:block;color:var(--mu);font-size:.8rem}.er-lb .lv{font:700 1.1rem var(--disp);text-align:right}
/* finestre */
.er-ov{position:fixed;inset:0;z-index:3000;display:grid;place-items:center;padding:14px;background:rgba(0,0,0,.78);overflow-y:auto}
.er-md{width:100%;max-width:480px;max-height:92vh;overflow-y:auto;padding:18px;border:1px solid var(--ac);border-radius:14px;background:var(--deep)}
.er-md h2{font-size:1.25rem;margin-bottom:10px}
.er-duel{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:10px 0}.er-duel b{display:block;overflow-wrap:anywhere}.er-duel small{color:var(--mu)}
.er-dl{max-height:150px;overflow-y:auto;font-size:.85rem;color:var(--mu);display:grid;gap:2px;margin:10px 0;padding:0;list-style:none}.er-dl b{color:var(--tx)}
.er-big{font:700 1.5rem var(--disp);text-align:center;margin:8px 0}.er-big.w{color:var(--gold)}.er-big.l{color:var(--bad)}
.p-sheet{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:10px 0}.p-sheet div{padding:8px 2px;text-align:center;border:1px solid var(--line);border-radius:10px;background:var(--inp);font-size:.72rem;color:var(--mu)}.p-sheet b{display:block;font:700 1.05rem var(--disp);color:var(--tx)}
.er-how li{margin-top:6px}
</style></head><body>

<main class="pg">
 <header><p class="kicker">Mini gioco di ruolo</p><h1>La guerra degli Eroi</h1>
 <p class="lead">Ogni duellante è un eroe con il suo nickname. Distribuisci i punti abilità, indossa l’equipaggiamento, sfida gli altri eroi in Arena e unisciti ogni giorno agli altri per abbattere il boss.</p></header>

 <section class="card er-top" id="top" aria-live="polite"><p class="mute" style="margin:0" role="status">Caricamento dell’eroe…</p></section>

 <div id="gate" hidden></div>

 <div id="main" hidden>
 <div class="tabs" role="tablist"><button role="tab" data-t="hero" aria-selected="true">Eroe</button><button role="tab" data-t="boss" aria-selected="false">Boss</button><button role="tab" data-t="arena" aria-selected="false">Arena</button><button role="tab" data-t="shop" aria-selected="false">Mercante</button><button role="tab" data-t="lb" aria-selected="false">Classifica</button></div>
 <div id="msg" role="status" aria-live="polite"></div>
 <section class="tp" id="p-hero"></section>
 <section class="tp" id="p-boss" hidden></section>
 <section class="tp" id="p-arena" hidden></section>
 <section class="tp" id="p-shop" hidden></section>
 <section class="tp" id="p-lb" hidden></section>
 </div>
</main>

/* ---------- utilità ---------- */

function clearSay(){flash=null;$('msg').innerHTML=''}
function rpc(name,args){return sb.rpc(name,args||{}).then(r=>{if(r.error)throw new Error(r.error.message||'Errore');return r.data})}
function errTxt(e){const m=String(e&&e.message||e);return /Modulo non attivo/i.test(m)?'Il gioco non è attivo al momento.':esc(m)}
async function run(btn,fn){if(busy)return;busy=true;if(btn)btn.disabled=true;try{await fn()}catch(e){if(/Modulo non attivo/i.test(String(e.message)))await boot();else say(errTxt(e),'bad')}finally{busy=false;if(btn&&btn.isConnected)btn.disabled=false}}
function pad(n){return String(n).padStart(2,'0')}
function cd(){const t=ST?new Date(ST.next_reset).getTime()-Date.now():0;if(t<=0)return '00:00:00';const s=Math.floor(t/1000);return pad(Math.floor(s/3600))+':'+pad(Math.floor(s%3600/60))+':'+pad(s%60)}
function ini(n){return esc((n||'?').trim().charAt(0).toUpperCase())}
function bonusTags(it){const o=[];STATS.forEach(s=>{const v=it['p_'+s[0]];if(v>0)o.push(`<span>+${v}% ${s[1]}</span>`)});
 if(it.xp_pct>0)o.push(`<span class="sp">+${it.xp_pct}% XP</span>`);if(it.extra_actions>0)o.push(`<span class="sp">+${it.extra_actions} azione boss/giorno</span>`);if(it.extra_fights>0)o.push(`<span class="sp">+${it.extra_fights} duello/giorno</span>`);
 return o.length?`<div class="er-bn">${o.join('')}</div>`:''}
function itemBox(it,extra){const s=SL[it.slot]||['','','•'];return `<div class="er-ic r-${esc(it.rarity)}" aria-hidden="true">${s[2]}</div><div style="min-width:0"><div class="er-rar r-${esc(it.rarity)}">${esc(RAR[it.rarity]||it.rarity)} · ${esc(s[1])}${extra||''}</div><div class="er-nm r-${esc(it.rarity)}">${esc(it.name)}</div>${bonusTags(it)}</div>`}
function pctSum(k){let t=0;Object.values(ME.equipped||{}).forEach(i=>{t+=Number(i['p_'+k]||0)});return t}

/* ---------- finestre ---------- */
function modal(html){const o=document.createElement('div');o.className='er-ov';o.setAttribute('role','dialog');o.setAttribute('aria-modal','true');o.innerHTML=`<div class="er-md">${html}</div>`;
 const close=()=>{o.remove();document.removeEventListener('keydown',k);if(o._t)clearInterval(o._t)};function k(e){if(e.key==='Escape')close()}
 o.onclick=e=>{if(e.target===o)close()};o.querySelectorAll('[data-close]').forEach(b=>b.onclick=close);document.addEventListener('keydown',k);document.body.appendChild(o);
 const f=o.querySelector('[data-close]');if(f)f.focus();o.close=close;return o}
async function heroSheet(uid){
 try{const h=await rpc('game_hero',{p_user:uid});
  const eq=SLOTS.map(s=>{const i=(h.equipped||{})[s[0]];return `<div class="er-sl" style="margin-top:8px">${i?itemBox(Object.assign({slot:s[0]},i)):`<div class="er-ic">${s[2]}</div><div class="mute">${s[1]}: vuoto</div>`}</div>`}).join('');
  modal(`<h2>${esc(h.nickname)} · Lv. ${num(h.level)}</h2><div class="p-sheet">${STATS.map(s=>`<div><b>${num(h.stats[s[0]])}</b>${s[3]}</div>`).join('')}</div>
   <p class="mute" style="margin:0 0 6px">PV ${num(h.max_hp)} · Duelli vinti ${num(h.duels_won)} · Boss battuti ${num(h.bosses_beaten)}</p>${eq}<button class="btn ghost block" style="margin-top:14px" data-close>Chiudi</button>`)
 }catch(e){say(errTxt(e),'bad')}}

/* ---------- schermata principale ---------- */
function paintTop(){
 const m=ST.me,pct=Math.min(100,Math.round(100*m.xp/m.xp_need));
 $('top').innerHTML=`<div class="er-who"><div class="er-pic" aria-hidden="true">${ini(m.nickname)}</div><div style="min-width:0"><h2>${esc(m.nickname)}</h2><div class="er-lv">Livello <b>${num(m.level)}</b> · ${num(m.max_hp)} PV</div></div><div class="er-bc"><b>${BAL==null?'—':num(BAL)}</b><span>BC</span></div></div>
  <div><div class="er-xp" role="progressbar" aria-valuemin="0" aria-valuemax="${m.xp_need}" aria-valuenow="${m.xp}" aria-label="Esperienza"><i style="width:${pct}%"></i></div><div class="er-xpt"><span>${num(m.xp)} / ${num(m.xp_need)} XP</span><span>${m.level>=9999?'Livello massimo':`al livello ${num(m.level+1)}`}</span></div></div>
  <div class="er-reset">Nuovo boss e nuove offerte del mercante tra <b data-cd>${cd()}</b></div>`}

function gate(html){ST=null;ME=null;$('main').hidden=true;$('gate').hidden=false;$('gate').innerHTML=html}
function gateLogin(){gate(`<section class="card er-gate" style="margin-top:20px"><h2>Entra dal Black Market</h2><p class="mute" style="max-width:34em;margin:0 auto 14px">La guerra degli Eroi usa il tuo profilo del Black Market: lo stesso nickname e lo stesso saldo di BC. Entra (o crea il profilo) dal Black Market e poi torna qui.</p><a class="btn gold" href="black-market.html">Accedi dal Black Market</a></section>`);
 $('top').innerHTML='<p class="mute" style="margin:0">Nessun profilo attivo.</p>'}

 $('top').innerHTML='<p class="mute" style="margin:0">Modulo non attivo.</p>'}

/* ---------- scheda Eroe ---------- */
function renderHero(){
 const m=ST.me,S=ST.settings;if(!draft)draft=Object.assign({},m.alloc);
 const used=STATS.reduce((t,s)=>t+draft[s[0]],0),left=S.points-used,changed=STATS.some(s=>draft[s[0]]!==m.alloc[s[0]]);
 const pays=m.stats_set&&m.fights_total>0&&S.respec_cost>0&&changed;

function logLine(l){const n=`<b>${esc(l.nickname)}</b>`,a=num(l.amount);
 switch(l.action){case 'attack':return `${n} attacca per ${a} danni${l.note==='colpo finale'?' — <b>colpo finale!</b>':l.note==='critico'?' (critico)':l.note==='schivata'?' e schiva il contraccolpo':''}`;
  case 'guard':return `${n} alza lo scudo di ${a}`;case 'heal':return `${n} cura ${l.target?`<b>${esc(l.target)}</b> `:''}di ${a} PV${l.note==='rianimato'?' e lo <b>rianima</b>':''}`;
  case 'study':return `${n} studia il boss: debolezza +${a}%`;default:return n}}

async function bossAct(btn,kind){
 await run(btn,async()=>{
  const r=await rpc('game_boss_act',{p_action:kind,p_target:kind==='heal'?(heal||null):null});
  let t='';
  if(kind==='attack')t=`Hai inflitto <b>${num(r.amount)}</b> danni${r.crit?' (critico!)':''}.${r.dodge?' Hai schivato il contraccolpo.':r.taken>0?` Il boss ti colpisce: −${num(r.taken)} PV.`:r.absorbed>0?` Lo scudo ha assorbito il contraccolpo (${num(r.absorbed)}).`:''}`;
  else if(kind==='guard')t=`Lo scudo comune cresce di <b>${num(r.amount)}</b>.`;
  else if(kind==='heal')t=`Hai curato di <b>${num(r.amount)}</b> PV${r.note==='rianimato'?' e rianimato l’alleato!':'.'}`;
  else t=`Hai svelato una debolezza: <b>+${num(r.amount)}%</b> ai danni di tutti (totale ${r.weak}%).`;
  if(r.ko)t+=' <b>Sei KO!</b> Servirà una cura.';
  if(r.defeated){const w=r.reward;t=`<b>🏆 Boss sconfitto!</b> ${t}`+(w?` Ricompensa: <b>+${num(w.bc)} BC</b>, <b>+${num(w.xp)} XP</b>${w.item?`, oggetto <b>${esc(w.item)}</b>`:''}${w.levels?`, <b>+${w.levels} livello!</b>`:''}.`:' (per la ricompensa servono almeno '+ST.settings.min_actions+' azioni).')}
  say(t,r.defeated?'good':'');
  await load(true)})}

function duelModal(r){

 const A=o.querySelector('#dA'),B=o.querySelector('#dB'),At=o.querySelector('#dAt'),Bt=o.querySelector('#dBt'),G=o.querySelector('#dLog');
 const upd=(ha,hb)=>{A.style.width=(100*ha/r.max_a)+'%';B.style.width=(100*hb/r.max_b)+'%';At.textContent=num(ha)+' / '+num(r.max_a);Bt.textContent=num(hb)+' / '+num(r.max_b)};
 const step=s=>{const w=s.w==='a'?esc(me.nickname):esc(op);G.insertAdjacentHTML('beforeend',`<li><b>${w}</b> ${s.x?'attacca ma viene schivato':`infligge ${num(s.d)} danni${s.c?' (critico!)':''}`}</li>`);G.scrollTop=G.scrollHeight;upd(s.ha,s.hb)};
 const fin=()=>{if(o._t){clearInterval(o._t);o._t=null}G.innerHTML=L.map(s=>`<li><b>${s.w==='a'?esc(me.nickname):esc(op)}</b> ${s.x?'attacca ma viene schivato':`infligge ${num(s.d)} danni${s.c?' (critico!)':''}`}</li>`).join('');upd(r.hp_a,r.hp_b);
  o.querySelector('#dRes').innerHTML=`<p class="er-big ${r.won?'w':'l'}">${r.won?`+${num(r.xp)} XP`:'Nessun XP'}</p><p class="mute" style="text-align:center;margin:0">${r.won?(r.levels>0?`Sei salito al livello <b>${num(r.level)}</b>!`:'Solo XP: nessun BC in palio in Arena.'):'Perdere non costa nulla. Riprova con un altro avversario.'}</p>`;o.querySelector('#dSkip').hidden=true};

function paint(){

function setTab(t,push){
 tab=t;document.querySelectorAll('.tabs [data-t]').forEach(b=>b.setAttribute('aria-selected',b.dataset.t===t));
 ['hero','boss','arena','shop','lb'].forEach(x=>$('p-'+x).hidden=x!==t);

async function boot(){
 if(!window.supabase){gate('<section class="card er-gate" style="margin-top:20px"><h2>Collegamento non riuscito</h2><p class="mute">Impossibile caricare la libreria di accesso. Controlla la connessione e riprova.</p></section>');return}
 try{
  if(!sb){sb=window.supabase.createClient(new URL(SUPABASE_URL).origin,SUPABASE_ANON_KEY,{auth:{persistSession:true,autoRefreshToken:true}});
   sb.auth.onAuthStateChange(ev=>{if(ev==='SIGNED_OUT')gateLogin()})}
  const{data:{session}}=await sb.auth.getSession();
  if(!session){gateLogin();return}
  const pr=await sb.from('profiles').select('id').eq('id',session.user.id).maybeSingle();
  if(!pr.data){gate('<section class="card er-gate" style="margin-top:20px"><h2>Completa il profilo</h2><p class="mute">Il tuo accesso non ha ancora un profilo Black Market.</p><a class="btn gold" href="black-market.html">Completa la registrazione</a></section>');return}
  const first=!ST;
  await load(false);
  if(first){const h=(location.hash||'').slice(1);setTab(['hero','boss','arena','shop','lb'].includes(h)?h:(ME.stats_set?'boss':'hero'),false)}
 }catch(e){
  if(/Modulo non attivo/i.test(String(e.message)))gateOff();
  else gate(`<section class="card er-gate" style="margin-top:20px"><h2>Errore di collegamento</h2><p class="mute">${errTxt(e)}</p><button class="btn ghost" id="retry">Riprova</button></section>`)}}

/* ---------- eventi ---------- */
document.querySelector('.tabs').onclick=e=>{const b=e.target.closest('[data-t]');if(b)setTab(b.dataset.t)};
document.addEventListener('click',e=>{
 const t=e.target.closest('button,[data-hero]');if(!t)return;
 if(t.id==='retry'){boot();return}
 if(t.dataset.hero){heroSheet(t.dataset.hero);return}
 const a=t.dataset.a;
 if(a&&draft){const k=t.dataset.k,S=ST.settings;const used=STATS.reduce((s,x)=>s+draft[x[0]],0);
  if(a==='+'&&used<S.points&&draft[k]<S.cap)draft[k]++;if(a==='-'&&draft[k]>0)draft[k]--;renderHero();
  const f=document.querySelector(`#p-hero [data-a="${a}"][data-k="${k}"]:not(:disabled)`);if(f)f.focus();return}
 if(t.id==='stReset'){draft=null;renderHero();return}
 if(t.id==='stSave'){run(t,async()=>{const d=draft,r=await rpc('game_set_stats',{p_for:d.for,p_des:d.des,p_vig:d.vig,p_spi:d.spi,p_frt:d.frt});
   say(`Punti salvati${r.paid>0?` (−${num(r.paid)} BC)`:''}. Ora puoi combattere!`,'good');draft=null;await load(false)});return}
 if(t.dataset.eq){run(t,async()=>{await rpc('game_equip',{p_item:t.dataset.eq});say('Oggetto indossato.','good');await load(true)});return}
 if(t.dataset.b){bossAct(t,t.dataset.b);return}
 if(t.dataset.duel){run(t,async()=>{const r=await rpc('game_duel',{p_target:t.dataset.duel});await load(false);duelModal(r)});return}
 if(t.dataset.buy){const id=t.dataset.buy;
  if(pending!==id){pending=id;renderShop();setTimeout(()=>{if(pending===id){pending=null;if(tab==='shop')renderShop()}},5000);return}
  pending=null;run(t,async()=>{const r=await rpc('game_buy',{p_item:id});say(`Hai acquistato <b>${esc(r.item)}</b> per ${num(r.price)} BC. Lo trovi nello zaino: indossalo dalla scheda Eroe.`,'good');BAL=r.balance;await load(true)});return}
});
document.addEventListener('change',e=>{
 if(e.target.id==='healTo'){heal=e.target.value;return}
 if(e.target.id==='arOpen'){const el=e.target;run(el,async()=>{await rpc('game_set_arena_open',{p_open:el.checked});say(el.checked?'Ora gli altri eroi possono sfidarti.':'Ora nessuno può sfidarti in Arena.','good');await load(false)})}});
setInterval(()=>{if(!ST)return;document.querySelectorAll('[data-cd]').forEach(e=>e.textContent=cd());
 if(new Date(ST.next_reset).getTime()<=Date.now()&&Date.now()-last>8000&&!busy&&!document.hidden)load(true).catch(()=>{})},1000);
setInterval(()=>{if(ST&&!document.hidden&&tab==='boss'&&!busy&&!document.querySelector('.er-ov'))load(true).catch(()=>{})},10000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&ST&&Date.now()-last>15000&&!busy)load(true).catch(()=>{})});
boot();
})();
</script></body></html>
