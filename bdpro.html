<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>YGO Deck Companion — dbpro.html</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/dexie@3/dist/dexie.min.js"></script>
    <style>
      html,body{height:100%}
      .thumb{width:48px;height:68px;object-fit:cover;border-radius:.375rem;background:#0a0a0a;border:1px solid #27272a;box-shadow:0 0 0 1px #000 inset}
      .btn{padding:.375rem .75rem;border-radius:.75rem;border:1px solid #3f3f46;background:#18181b}
      .btn:hover{background:#27272a}
      .pill{padding:.125rem .5rem;border-radius:.5rem;border:1px solid #3f3f46}
      .active{color:#fbbf24;border-color:#f59e0b;background:rgba(245,158,11,.08)}
      .qty{position:absolute;bottom:-6px;right:-6px;background:#0b0b0b;border:1px solid #3f3f46;border-radius:999px;font-size:10px;padding:.1rem .4rem}
    </style>
  </head>
  <body class="min-h-screen bg-neutral-950 text-neutral-100">
    <div id="root"></div>

    <script type="text/babel">
      // =============== Utils ===============
      const cx=(...xs)=>xs.filter(Boolean).join(" ");
      const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
      const fmt=(n)=>new Intl.NumberFormat('it-IT').format(n);
      const getThumbUrl=(c)=>c?.card_images?.[0]?.image_url_small||c?.card_images?.[0]?.image_url||"";
      const isExtraType=(c)=>/Fusion|Synchro|XYZ|Xyz|Link/i.test(c?.type||"");

      // =============== Data Layer (Dexie + YGOPRODeck) ===============
      const API_URL="https://db.ygoprodeck.com/api/v7/cardinfo.php";
      const db=new Dexie("ygodeck");
      db.version(2).stores({
        cards:"id,name,type,archetype,attribute,level,linkval,race",
        decks:"id,name,format,updatedAt",
        meta:"key"
      });
      const getMeta=(k)=>db.meta.get(k);
      const setMeta=(k,v)=>db.meta.put({key:k,value:v});
      async function seedCards({onProgress}={}) {
        const res=await fetch(API_URL,{cache:"no-store"});
        if(!res.ok) throw new Error("Download cards failed");
        const {data}=await res.json();
        await db.cards.clear();
        const CH=2000;
        for(let i=0;i<data.length;i+=CH){
          await db.cards.bulkPut(data.slice(i,i+CH));
          onProgress?.(Math.min(100,Math.round(((i+CH)/data.length)*100)));
        }
        await setMeta("lastSync",Date.now());
        return data.length;
      }
      const countCachedCards=()=>db.cards.count();
      const getCardById=(id)=>db.cards.get(+id);
      async function searchCards(query,{type,attribute,limit=50}={}) {
        let coll=db.cards.toCollection();
        if(type&&type!=="All") coll=coll.filter(c=>c.type===type);
        if(attribute&&attribute!=="All") coll=coll.filter(c=>c.attribute===attribute);
        if(query){
          const q=query.toLowerCase();
          coll=coll.filter(c=>c.name?.toLowerCase().includes(q)||c.desc?.toLowerCase().includes(q)||(c.archetype||"").toLowerCase().includes(q));
        }
        return coll.limit(limit).toArray();
      }
      function banTCG(card){
        const s=card?.banlist_info?.ban_tcg;
        if(!s) return "Unlimited";
        if(s==="Banned") return "Forbidden";
        if(s==="Limited") return "Limited";
        if(s==="Semi-Limited") return "Semi-Limited";
        return "Unlimited";
      }
      // Deck persistence
      const listDecks=async()=> (await db.decks.toArray()).sort((a,b)=>+new Date(b.updatedAt)-+new Date(a.updatedAt));
      const getDeck=(id)=>db.decks.get(id);
      async function putDeck(deck){
        if(!deck.id) throw new Error("Deck senza id");
        const saved={...deck,updatedAt:deck.updatedAt||new Date().toISOString()};
        await db.decks.put(saved); return saved;
      }

      // =============== YDK helpers ===============
      const deckToYDK=(deck)=>{
        const block=arr=>arr.flatMap(cr=>Array(cr.qty).fill(cr.id)).join("\n");
        return `#created by YGO Deck Companion
#main
${block(deck.main)}
#extra
${block(deck.extra)}
!side
${block(deck.side)}`.trim();
      };
      function parseYDK(text){
        const lines=text.split(/\r?\n/); let sec="main";
        const out={main:[],extra:[],side:[]}, map={main:{},extra:{},side:{}};
        for(const raw of lines){
          const l=raw.trim(); if(!l||l.startsWith("#")) continue;
          if(l==="#main"){sec="main";continue;}
          if(l==="#extra"){sec="extra";continue;}
          if(l==="!side"){sec="side";continue;}
          const id=+l; if(Number.isNaN(id)) continue;
          map[sec][id]=(map[sec][id]||0)+1;
        }
        for(const s of ["main","extra","side"])
          out[s]=Object.entries(map[s]).map(([id,qty])=>({id:+id,qty:+qty}));
        return out;
      }

      // =============== Tagging ===============
      const ROLE_TAGS=["Starter","Extender","Disruptor","Going-Second","Brick","Floodgate","Wincon","Bridge"];
      function autoTags(card){
        const t=(card?.desc||"").toLowerCase(), tags=new Set();
        if(/add .* from your deck|aggiungi|cerca/.test(t)) tags.add("Starter"),tags.add("Bridge");
        if(/special summon|evoca special|fusion summon|synchro summon|link summon/.test(t)) tags.add("Extender");
        if(/negate|nega|annulla/.test(t)) tags.add("Disruptor");
        if(/destroy all|distruggi tutti|board wipe|rimuovi/.test(t)) tags.add("Going-Second");
        if(/cannot be normal summoned|non può essere evocata/.test(t)) tags.add("Brick");
        if(/cannot|non possono/.test(t)) tags.add("Floodgate");
        if(/win the duel|condizione di vittoria/.test(t)) tags.add("Wincon");
        if(/draw/.test(t)) tags.add("Bridge");
        return [...tags];
      }
    // =============== App + Menu ===============
      function App(){
        const [route,setRoute]=React.useState({name:"home"}); // home|editor|cards|settings
        const [decks,setDecks]=React.useState([]);
        const [activeDeckId,setActiveDeckId]=React.useState(null);
        const [stats,setStats]=React.useState({count:0,lastSync:null});

        React.useEffect(()=>{
          (async()=>{
            const [count,meta,decksFromDb]=await Promise.all([countCachedCards(),getMeta("lastSync"),listDecks()]);
            setStats({count,lastSync:meta?.value||null});
            setDecks(decksFromDb);
            if(decksFromDb[0]) setActiveDeckId(decksFromDb[0].id);
          })();
        },[]);

        const upsertDeck=(deck,{openAfter=false}={})=>{
          if(!deck) return;
          (async()=>{
            const saved=await putDeck(deck);
            setDecks(prev=>{const i=prev.findIndex(d=>d.id===saved.id); const n=[...prev]; if(i>=0)n[i]=saved; else n.unshift(saved); return n;});
            setActiveDeckId(saved.id);
            if(openAfter) setRoute({name:"editor"});
          })();
        };

        const [seeding, setSeeding]=React.useState(false);
        const [progress,setProgress]=React.useState(0);
        const actions={
          seedCards: async()=>{
            try{
              setSeeding(true); setProgress(0);
              const n=await seedCards({onProgress:p=>setProgress(p)});
              const [count,meta]=await Promise.all([countCachedCards(),getMeta("lastSync")]);
              setStats({count,lastSync:meta?.value||null});
              alert(`Database carte aggiornato: ${fmt(n)} carte.`);
            }catch(e){ alert("Errore seed: "+e.message); }
            finally{ setSeeding(false); }
          },
          newDeck: ()=>{ const d=createDeckPrompt(); if(d) upsertDeck(d,{openAfter:true}); },
          importYDK: ()=>{ const txt=prompt("Incolla qui il contenuto .ydk",""); if(txt!=null){ const d=importYDKPrompt(txt); if(d) upsertDeck(d,{openAfter:true}); } },
          openLastDeck: ()=>{ const last=decks[0]; if(last) {setActiveDeckId(last.id); setRoute({name:"editor"});} else alert("Nessun deck salvato."); }
        };

        const currentDeck=decks.find(d=>d.id===activeDeckId)||null;

        return (
          <div className="min-h-screen">
            <GlobalMenu route={route} setRoute={setRoute} stats={stats} actions={actions} hasDeck={!!currentDeck} seeding={seeding} progress={progress}/>
            {route.name==="home" && <Home decks={decks} onOpen={(id)=>{setActiveDeckId(id); setRoute({name:"editor"})}}/>}
            {route.name==="cards" && <CardsPage/>}
            {route.name==="settings" && <SettingsPage stats={stats} onSeed={actions.seedCards} seeding={seeding} progress={progress}/>}
            {route.name==="editor" && <Editor deck={currentDeck} onChange={(d)=>upsertDeck(d)} onBack={()=>setRoute({name:"home"})}/>}
            <Footer/>
          </div>
        );
      }

      function GlobalMenu({route,setRoute,stats,actions,hasDeck,seeding,progress}){
        const [open,setOpen]=React.useState(false);
        const item=(key,label)=>(<button onClick={()=>{setRoute({name:key}); setOpen(false);}} className={cx("pill text-sm",route.name===key&&"active")}>{label}</button>);
        const SeedBtn=(<button className={cx("btn",seeding&&"active")} onClick={actions.seedCards} disabled={seeding}>{seeding?`Scarico… ${progress}%`:"Scarica/aggiorna DB carte"}</button>);
        return (
          <header className="sticky top-0 z-30 border-b border-neutral-800/60 backdrop-blur supports-[backdrop-filter]:bg-neutral-950/70">
            <div className="mx-auto max-w-7xl px-4 py-3 flex items-center justify-between">
              <div className="flex items-center gap-3">
                <div className="h-8 w-8 rounded-xl bg-gradient-to-br from-amber-400 to-rose-500 shadow"></div>
                <h1 className="text-lg font-semibold">YGO Deck Companion <span className="text-amber-300">TCG</span></h1>
                <span className="ml-3 text-xs rounded-full bg-neutral-800 px-2 py-1 border border-neutral-700">dbpro</span>
                <span className="ml-3 text-[11px] text-neutral-400 hidden md:inline">Carte: {fmt(stats.count)} {stats.lastSync&&`• Sync: ${new Date(stats.lastSync).toLocaleString()}`}</span>
              </div>
              <div className="hidden md:flex items-center gap-2">
                {item("home","Home")}{item("editor","Editor")}{item("cards","Database")}{item("settings","Impostazioni")}
                {SeedBtn}
                <button className="btn" onClick={actions.newDeck}>+ Nuovo Deck</button>
                <button className="btn" onClick={actions.importYDK}>Importa .ydk</button>
                <button className="btn" onClick={actions.openLastDeck} disabled={!hasDeck}>Apri ultimo</button>
              </div>
              <button className="md:hidden btn" onClick={()=>setOpen(v=>!v)}>{open?"Chiudi":"Menu"}</button>
            </div>
            {open && (
              <div className="md:hidden border-t border-neutral-800 bg-neutral-950">
                <div className="mx-auto max-w-7xl px-4 py-3 flex flex-wrap gap-2">
                  {item("home","Home")}{item("editor","Editor")}{item("cards","Database")}{item("settings","Impostazioni")}
                  {SeedBtn}
                  <button className="btn" onClick={actions.newDeck}>+ Nuovo Deck</button>
                  <button className="btn" onClick={actions.importYDK}>Importa .ydk</button>
                  <button className="btn" onClick={actions.openLastDeck} disabled={!hasDeck}>Apri ultimo</button>
                </div>
              </div>
            )}
          </header>
        );
      }

      function Footer(){
        return (
          <footer className="mx-auto max-w-7xl px-4 pb-10 text-[11px] text-neutral-500">
            <div className="pt-6 mt-6">v0.8 — Switch “Aggiungi alla Side” nel motore ricerca; anteprima deck (Main/Extra/Side), aggiunta Extra automatica, persistenza, seed DB.</div>
          </footer>
        );
      }

      // =============== Home ===============
      function Home({decks,onOpen}){
        const recent=[...decks].sort((a,b)=>+new Date(b.updatedAt)-+new Date(a.updatedAt));
        return (
          <main className="mx-auto max-w-7xl px-4 py-6 grid grid-cols-1 lg:grid-cols-12 gap-6">
            <section className="lg:col-span-7">
              <div className="rounded-2xl border border-neutral-800 bg-neutral-900/40 p-4">
                <h2 className="text-sm font-semibold mb-3">I tuoi deck</h2>
                <ul className="space-y-3">
                  {recent.map(d=>(
                    <li key={d.id} className="rounded-xl border border-neutral-800 bg-neutral-900/60 hover:bg-neutral-800/60 transition p-3">
                      <div className="flex items-center justify-between gap-3">
                        <div>
                          <div className="text-sm font-medium">{d.name}</div>
                          <div className="text-[11px] text-neutral-400">Aggiornato {new Date(d.updatedAt).toLocaleString()}</div>
                        </div>
                        <button className="btn" onClick={()=>onOpen(d.id)}>Apri</button>
                      </div>
                    </li>
                  ))}
                  {!recent.length && <li className="text-sm text-neutral-400">Nessun deck salvato. Crea o importa dal menu.</li>}
                </ul>
              </div>
            </section>
            <aside className="lg:col-span-5">
              <div className="rounded-2xl border border-neutral-800 bg-neutral-900/40 p-4">
                <h2 className="text-sm font-semibold mb-2">Suggerimenti</h2>
                <ul className="text-sm space-y-2 text-neutral-300">
                  <li>Scarica il database carte da <span class="pill">Impostazioni</span>.</li>
                  <li>Nuovo deck con <span class="pill">+ Nuovo Deck</span> o importa un <span class="pill">.ydk</span>.</li>
                  <li>Con lo switch “Aggiungi alla Side” le carte vanno direttamente in Side.</li>
                </ul>
              </div>
            </aside>
          </main>
        );
      }
    // =============== Cards & Settings ===============
      function CardsPage(){
        const [q,setQ]=React.useState(""); const [res,setRes]=React.useState([]);
        React.useEffect(()=>{let alive=true;(async()=>{const r=await searchCards(q,{limit:30}).catch(()=>[]); if(alive) setRes(r);})(); return()=>{alive=false};},[q]);
        return (
          <main className="mx-auto max-w-7xl px-4 py-6">
            <div className="rounded-2xl border border-neutral-800 bg-neutral-900/40 p-4">
              <div className="flex items-center gap-2">
                <input value={q} onChange={e=>setQ(e.target.value)} placeholder="Cerca carte…" className="w-full rounded-xl bg-neutral-900 border border-neutral-700 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-amber-500/50"/>
                <span className="text-xs text-neutral-400">Risultati: {res.length}</span>
              </div>
              <div className="mt-3 grid sm:grid-cols-2 md:grid-cols-3 gap-3">
                {res.map(c=>(
                  <div key={c.id} className="rounded-lg border border-neutral-800 p-2 flex gap-2">
                    <img className="thumb" src={getThumbUrl(c)} alt={c.name} loading="lazy"/>
                    <div>
                      <div className="text-sm font-medium">{c.name}</div>
                      <div className="text-[11px] text-neutral-400">{c.type} {c.attribute?`• ${c.attribute}`:""}</div>
                      <div className="text-[11px] text-neutral-500 line-clamp-2 mt-1">{c.desc}</div>
                    </div>
                  </div>
                ))}
              </div>
            </div>
          </main>
        );
      }

      function SettingsPage({stats,onSeed,seeding,progress}){
        return (
          <main className="mx-auto max-w-7xl px-4 py-6">
            <div className="rounded-2xl border border-neutral-800 bg-neutral-900/40 p-5 space-y-3">
              <h2 className="text-sm font-semibold">Impostazioni & Dati</h2>
              <div className="text-sm text-neutral-300">Carte in cache: <b>{fmt(stats.count)}</b>{stats.lastSync&&<> • Ultimo sync: <b>{new Date(stats.lastSync).toLocaleString()}</b></>}</div>
              <div className="flex flex-wrap gap-2">
                <button className={cx("btn",seeding&&"active")} onClick={onSeed} disabled={seeding}>{seeding?`Scarico… ${progress}%`:"Scarica/Aggiorna database carte"}</button>
                <button className="btn" onClick={async()=>{await db.cards.clear(); const c=await countCachedCards(); alert("Cache carte svuotata. Totale: "+c);}}>Svuota cache carte</button>
                <button className="btn" onClick={async()=>{await db.decks.clear(); alert("Tutti i deck sono stati rimossi.");}}>Elimina tutti i deck</button>
              </div>
            </div>
          </main>
        );
      }

      // =============== Shared ===============
      const countRoles=(deck)=>{const init={"Starter":0,"Extender":0,"Disruptor":0,"Going-Second":0,"Brick":0,"Floodgate":0,"Wincon":0,"Bridge":0}; (deck?.main||[]).forEach(cr=>(cr.tags||[]).forEach(t=>init[t]+=cr.qty)); return init;};
      function RoleToggles({value,onToggle}){
        return (<div className="mt-2 flex flex-wrap gap-1">
          {ROLE_TAGS.map(t=>{const a=value.includes(t); return <button key={t} className={cx("text-[11px] px-2 py-0.5 rounded border",a?"active":"border-neutral-700 bg-neutral-900 text-neutral-300")} onClick={()=>onToggle(t)}>{t}</button>;})}
        </div>);
      }
      function validateDeckTCG(deck){
        const totals={main:(deck.main||[]).reduce((a,b)=>a+b.qty,0),extra:(deck.extra||[]).reduce((a,b)=>a+b.qty,0),side:(deck.side||[]).reduce((a,b)=>a+b.qty,0)};
        const banErrors=[]; const check=list=>{const g={}; list.forEach(x=>g[x.id]=(g[x.id]||0)+x.qty);
          for(const [id,qty] of Object.entries(g)){const e=list.find(x=>x.id==id),name=e?.name||id,st=e?.ban||"Unlimited";
            if(qty>3) banErrors.push(`${name}: ${qty} copie (max 3)`);
            if(st==="Limited"&&qty>1) banErrors.push(`${name} è Limited: ${qty} copie (max 1)`);
            if(st==="Semi-Limited"&&qty>2) banErrors.push(`${name} è Semi-Limited: ${qty} copie (max 2)`);
            if(st==="Forbidden"&&qty>0) banErrors.push(`${name} è Forbidden nel TCG`);
          }};
        check(deck.main||[]); check(deck.extra||[]); check(deck.side||[]); 
        return {mainOk:totals.main>=40&&totals.main<=60,extraOk:totals.extra<=15,sideOk:totals.side<=15,banErrors};
      }

      // =============== Editor (preview in alto + switch Side + ricerca sotto) ===============
      function Editor({deck,onChange,onBack}){
        const [state,setState]=React.useState(()=>deck?JSON.parse(JSON.stringify(deck)):{});
        const [q,setQ]=React.useState(""); const [type,setType]=React.useState("All"); const [attr,setAttr]=React.useState("All");
        const [res,setRes]=React.useState([]); const [loading,setLoading]=React.useState(false);
        const [showSide,setShowSide]=React.useState(false);
        const [addToSide,setAddToSide]=React.useState(false); // ⬅️ nuovo switch

        React.useEffect(()=>{ setState(deck?JSON.parse(JSON.stringify(deck)):{}) },[deck?.id]);
        React.useEffect(()=>{let alive=true;(async()=>{setLoading(true); const r=await searchCards(q,{type,attribute:attr,limit:30}).catch(()=>[]); if(alive){setRes(r); setLoading(false);}})(); return()=>{alive=false};},[q,type,attr]);
        React.useEffect(()=>{ if(addToSide) setShowSide(true); },[addToSide]); // mostra side quando switch attivo

        if(!deck) return (
          <main className="mx-auto max-w-7xl px-4 py-6">
            <div className="rounded-2xl border border-neutral-800 bg-neutral-900/40 p-6">Nessun deck aperto. Vai su <span class="pill">Home</span> o usa <span class="pill">+ Nuovo Deck</span> dal menu.</div>
          </main>
        );

        const totals={main:(state.main||[]).reduce((a,b)=>a+b.qty,0),extra:(state.extra||[]).reduce((a,b)=>a+b.qty,0),side:(state.side||[]).reduce((a,b)=>a+b.qty,0)};
        const validation=validateDeckTCG(state);

        const addCardAuto=(card)=>{
          const section = addToSide ? "side" : (isExtraType(card) ? "extra" : "main");
          setState(prev=>{
            const list=[...(prev[section]||[])];
            const i=list.findIndex(x=>x.id===card.id);
            if(i>=0) list[i]={...list[i],qty:clamp(list[i].qty+1,1,3)};
            else list.push({id:card.id,name:card.name,qty:1,tags:autoTags(card),ban:banTCG(card)||"Unlimited",thumb:getThumbUrl(card)});
            return {...prev,[section]:list,updatedAt:new Date().toISOString()};
          });
        };
        const decOne=(section,id)=>{
          setState(prev=>{
            const list=[...(prev[section]||[])]; const i=list.findIndex(x=>x.id===id); if(i<0) return prev;
            const next=list[i].qty-1; if(next<=0) list.splice(i,1); else list[i].qty=next;
            return {...prev,[section]:list,updatedAt:new Date().toISOString()};
          });
        };
        const onSave=async()=>{try{const saved={...state,updatedAt:new Date().toISOString(),id:deck.id,name:deck.name,format:"TCG"}; await putDeck(saved); onChange?.(saved); alert("Deck salvato ✅");}catch(e){alert("Errore salvataggio: "+e.message);} };
        const onExport=()=>{const ydk=deckToYDK(state); const blob=new Blob([ydk],{type:"text/plain"}); const url=URL.createObjectURL(blob); const a=document.createElement("a"); a.href=url; a.download=`${state.name||"deck"}.ydk`; a.click(); URL.revokeObjectURL(url);};

        return (
          <main className="mx-auto max-w-7xl px-4 py-6 space-y-6">
            {/* Header editor */}
            <div className="flex items-center justify-between">
              <div>
                <h2 className="text-sm font-semibold">{state.name||deck.name}</h2>
                <div className="text-[11px] text-neutral-400">Aggiornato {new Date(state.updatedAt||deck.updatedAt).toLocaleString()}</div>
              </div>
              <div className="flex items-center gap-2">
                <button className="pill" onClick={onBack}>← Home</button>
                <button className="btn" onClick={onSave}>Salva</button>
                <button className="btn active" onClick={onExport}>Export .ydk</button>
              </div>
            </div>

            {/* Riquadro anteprima deck */}
            <div className="rounded-2xl border border-neutral-800 bg-neutral-900/40 p-4">
              <div className="flex items-center justify-between">
                <div className="text-sm font-semibold">Anteprima Deck</div>
                <label className="text-xs flex items-center gap-2">
                  <input type="checkbox" className="accent-amber-500" checked={showSide} onChange={e=>setShowSide(e.target.checked)}/>
                  Mostra Side
                </label>
              </div>

              <PreviewRow title={`Main (${totals.main})`} items={state.main||[]} onClickThumb={(id)=>decOne("main",id)}/>
              <PreviewRow title={`Extra (${totals.extra}/15)`} items={state.extra||[]} onClickThumb={(id)=>decOne("extra",id)}/>
              {showSide && <PreviewRow title={`Side (${totals.side}/15)`} items={state.side||[]} onClickThumb={(id)=>decOne("side",id)}/>}

              <div className="mt-3 grid grid-cols-1 md:grid-cols-3 gap-2 text-xs">
                <div className={cx("rounded-lg px-3 py-2 border",validation.mainOk?"border-emerald-700 bg-emerald-900/20 text-emerald-300":"border-red-800 bg-red-900/20 text-red-300")}>{`Main: ${totals.main}/40–60`}</div>
                <div className={cx("rounded-lg px-3 py-2 border",validation.extraOk?"border-emerald-700 bg-emerald-900/20 text-emerald-300":"border-red-800 bg-red-900/20 text-red-300")}>{`Extra: ${totals.extra}/15`}</div>
                <div className={cx("rounded-lg px-3 py-2 border",validation.sideOk?"border-emerald-700 bg-emerald-900/20 text-emerald-300":"border-red-800 bg-red-900/20 text-red-300")}>{`Side: ${totals.side}/15`}</div>
              </div>

              {!!validation.banErrors.length && (
                <div className="mt-3 rounded-xl border border-red-900 bg-red-950/40 p-3 text-sm">
                  <div className="font-semibold text-red-300 mb-1">Violazioni Banlist (TCG)</div>
                  <ul className="list-disc list-inside space-y-1">{validation.banErrors.map((e,i)=>(<li key={i}>{e}</li>))}</ul>
                </div>
              )}
            </div>

            {/* Ricerca carte sotto l’anteprima */}
            <div className="rounded-2xl border border-neutral-800 bg-neutral-900/40 p-4">
              <div className="flex items-center justify-between mb-2">
                <h3 className="text-sm font-semibold">Database Carte</h3>
                <label className="text-xs flex items-center gap-2">
                  <input type="checkbox" className="accent-amber-500" checked={addToSide} onChange={e=>setAddToSide(e.target.checked)}/>
                  Aggiungi alla Side
                </label>
              </div>

              <div className="grid grid-cols-2 gap-2 text-xs">
                <input value={q} onChange={e=>setQ(e.target.value)} placeholder="Cerca per nome/testo…" className="w-full rounded-xl bg-neutral-900 border border-neutral-700 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-amber-500/50 col-span-2"/>
                <select value={type} onChange={e=>setType(e.target.value)} className="rounded-lg bg-neutral-900 border border-neutral-700 px-2 py-2">
                  <option value="All">Tipo: Tutti</option><option>Monster</option><option>Spell</option><option>Trap</option>
                </select>
                <select value={attr} onChange={e=>setAttr(e.target.value)} className="rounded-lg bg-neutral-900 border border-neutral-700 px-2 py-2">
                  <option value="All">Attributo: Tutti</option><option>LIGHT</option><option>DARK</option><option>FIRE</option><option>WATER</option><option>WIND</option><option>EARTH</option><option>DIVINE</option>
                </select>
              </div>

              <div className="mt-3 space-y-2 max-h-[50vh] overflow-auto pr-1">
                {loading && <div className="text-xs text-neutral-400">Carico…</div>}
                {!loading && res.map(c=>(
                  <div key={c.id} className="rounded-lg border border-neutral-800 p-2">
                    <div className="flex items-start justify-between gap-2">
                      <div className="flex items-start gap-2">
                        <img className="thumb" src={getThumbUrl(c)} alt={c.name} loading="lazy"/>
                        <div>
                          <div className="text-sm font-medium">{c.name}</div>
                          <div className="text-[11px] text-neutral-400">{c.type}{c.race?` • ${c.race}`:""} {c.attribute?`• ${c.attribute}`:""}</div>
                          <div className="text-[11px] text-neutral-500 line-clamp-2 mt-1">{c.desc}</div>
                        </div>
                      </div>
                      <button className="btn" onClick={()=>addCardAuto(c)}>
                        {addToSide ? "Aggiungi (Side)" : (isExtraType(c) ? "Aggiungi (Extra)" : "Aggiungi (Main)")}
                      </button>
                    </div>
                  </div>
                ))}
                {!loading && !res.length && <div className="text-xs text-neutral-400">Nessun risultato (scarica prima il DB in Impostazioni).</div>}
              </div>
            </div>
          </main>
        );
      }

      // Row di miniature con click-to-remove
      function PreviewRow({title,items,onClickThumb}){
        return (
          <div className="mt-3">
            <div className="text-xs text-neutral-300 mb-1">{title}</div>
            <div className="flex flex-wrap gap-2">
              {items.map(it=>(
                <div key={it.id} className="relative" title="Clic per rimuovere 1 copia" onClick={()=>onClickThumb(it.id)}>
                  <img className="thumb cursor-pointer hover:brightness-110 transition" src={it.thumb||""} alt={it.name||it.id} loading="lazy"/>
                  <span className="qty">{it.qty}</span>
                </div>
              ))}
              {!items.length && <div className="text-[11px] text-neutral-500">Vuoto</div>}
            </div>
          </div>
        );
      }

      // Bootstrap
      const root=ReactDOM.createRoot(document.getElementById("root")); root.render(<App />);
    </script>
  </body>
</html>
