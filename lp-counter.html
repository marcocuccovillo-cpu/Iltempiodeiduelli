<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Life Points — Duel Counter</title>
<meta name="description" content="Calcolatore di Life Points a due giocatori con timer impostabile e cronologia danni." />
<meta name="theme-color" content="#0b0d16" />
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Manrope:wght@400;500;700;800&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  :root{
    --bg:#0b0d16;
    --gold:#c9a24d;
    --gold-soft:#e6c877;
    --blue:#5b8cff;
    --blue-soft:#8fb0ff;
    --text:#eae7dc;
    --muted:#8891a8;
    --win:#4f9d6e;
    --loss:#c0524a;
    --amber:#e0a83f;
    --line:rgba(255,255,255,.10);
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; }
  body{
    margin:0; overflow:hidden;
    background:var(--bg);
    color:var(--text);
    font-family:"Manrope", system-ui, sans-serif;
    -webkit-font-smoothing:antialiased;
    display:flex; flex-direction:column;
    height:100dvh;
  }
  h1,h2,h3{ font-family:"Cinzel", serif; margin:0; }
  button{ font-family:inherit; }
  ::selection{ background:rgba(201,162,77,.35); }

  /* ===== Player panels ===== */
  .field{ flex:1; display:flex; flex-direction:column; min-height:0; }
  .player{
    flex:1; position:relative; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:.65rem;
    padding:.9rem 1rem; min-height:0; overflow:hidden;
  }
  .player.p2{
    transform:rotate(180deg);
    background:radial-gradient(600px 260px at 50% 0%, rgba(91,140,255,.14), transparent 70%);
  }
  .player.p1{
    background:radial-gradient(600px 260px at 50% 100%, rgba(201,162,77,.14), transparent 70%);
  }
  .player .accent-line{
    position:absolute; left:8%; right:8%; height:1px;
  }
  .player.p2 .accent-line{ top:0; background:linear-gradient(90deg, transparent, var(--blue), transparent); opacity:.6; }
  .player.p1 .accent-line{ bottom:0; background:linear-gradient(90deg, transparent, var(--gold), transparent); opacity:.6; }

  .name-input{
    background:transparent; border:none; text-align:center;
    font-family:"Cinzel", serif; font-weight:600; letter-spacing:.08em; text-transform:uppercase;
    font-size:clamp(.85rem, 2vw, 1.05rem); color:var(--muted); width:min(80%, 20rem);
    padding:.15rem .3rem; border-radius:6px;
  }
  .name-input:focus{ outline:none; color:var(--text); background:rgba(255,255,255,.04); }
  .p2 .name-input{ color:var(--blue-soft); }
  .p1 .name-input{ color:var(--gold-soft); }

  .lp-display{
    font-family:"IBM Plex Mono", monospace; font-weight:700; font-variant-numeric:tabular-nums;
    font-size:clamp(2.6rem, 12vw, 5.2rem); line-height:1; letter-spacing:.01em;
    transition:transform .12s ease;
  }
  .lp-display.bump{ transform:scale(1.06); }
  .lp-display.zero{ color:var(--loss); }

  .quickrow{ display:flex; gap:.4rem; flex-wrap:wrap; justify-content:center; }
  .qbtn{
    appearance:none; cursor:pointer; border-radius:10px; padding:.45rem .7rem;
    font-weight:800; font-size:.82rem; border:1px solid var(--line);
    background:rgba(255,255,255,.03); color:var(--text);
    transition:transform .1s ease, background .1s ease;
    font-family:"IBM Plex Mono", monospace;
  }
  .qbtn:active{ transform:scale(.94); }
  .qbtn.dmg{ border-color:rgba(192,82,74,.4); color:#ffb3ac; }
  .qbtn.dmg:hover{ background:rgba(192,82,74,.12); }
  .qbtn.heal{ border-color:rgba(79,157,110,.4); color:#a9e0bb; }
  .qbtn.heal:hover{ background:rgba(79,157,110,.12); }

  .customrow{ display:flex; align-items:center; gap:.4rem; }
  .customrow input{
    width:5.2rem; text-align:center; padding:.4rem .3rem; border-radius:8px;
    border:1px solid var(--line); background:rgba(255,255,255,.03); color:var(--text);
    font-family:"IBM Plex Mono", monospace; font-weight:600;
  }
  .customrow input:focus{ outline:none; border-color:var(--gold); }
  .cbtn{
    appearance:none; cursor:pointer; border-radius:8px; width:2.3rem; height:2.3rem;
    font-weight:800; font-size:1.1rem; border:1px solid var(--line); background:rgba(255,255,255,.03); color:var(--text);
  }
  .cbtn.minus{ color:#ffb3ac; border-color:rgba(192,82,74,.4); }
  .cbtn.plus{ color:#a9e0bb; border-color:rgba(79,157,110,.4); }

  /* ===== Center control bar ===== */
  .bar{
    flex:0 0 auto; display:flex; align-items:center; justify-content:center; gap:.6rem;
    padding:.5rem .6rem; background:#0f1220; border-top:1px solid var(--line); border-bottom:1px solid var(--line);
    flex-wrap:wrap; position:relative; z-index:2;
  }
  .bar .group{ display:flex; align-items:center; gap:.4rem; }
  .icon-btn{
    appearance:none; cursor:pointer; border-radius:9px; padding:.4rem .55rem;
    border:1px solid var(--line); background:rgba(255,255,255,.03); color:var(--text);
    font-size:.8rem; font-weight:700; display:flex; align-items:center; gap:.35rem;
  }
  .icon-btn:hover{ border-color:var(--gold); }
  .icon-btn:disabled{ opacity:.35; cursor:not-allowed; }
  .icon-btn.primary{
    background:linear-gradient(180deg, var(--gold-soft), var(--gold)); color:#151220; border:none;
  }

  .timer{
    font-family:"IBM Plex Mono", monospace; font-weight:700; font-variant-numeric:tabular-nums;
    font-size:1.5rem; min-width:4.2rem; text-align:center; color:var(--gold-soft);
  }
  .timer.amber{ color:var(--amber); }
  .timer.critical{ color:var(--loss); animation:pulse 1s infinite; }
  @keyframes pulse{ 0%,100%{ opacity:1; } 50%{ opacity:.45; } }

  .mini-input{
    width:3.4rem; text-align:center; padding:.35rem .2rem; border-radius:7px;
    border:1px solid var(--line); background:rgba(255,255,255,.03); color:var(--text);
    font-family:"IBM Plex Mono", monospace; font-size:.82rem;
  }
  .mini-input:focus{ outline:none; border-color:var(--gold); }
  .barlabel{ font-size:.68rem; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); }

  /* ===== History drawer ===== */
  .overlay{
    position:fixed; inset:0; background:rgba(4,5,10,.7); backdrop-filter:blur(3px);
    display:flex; align-items:flex-end; justify-content:center; z-index:50;
    opacity:0; pointer-events:none; transition:opacity .18s ease;
  }
  .overlay.open{ opacity:1; pointer-events:auto; }
  .drawer{
    width:min(100%, 34rem); max-height:78vh; background:#141829; border:1px solid var(--line);
    border-bottom:none; border-radius:16px 16px 0 0; padding:1rem 1rem .9rem;
    display:flex; flex-direction:column; gap:.6rem;
    transform:translateY(12px); transition:transform .18s ease;
  }
  .overlay.open .drawer{ transform:translateY(0); }
  .drawer-head{ display:flex; align-items:center; justify-content:space-between; }
  .drawer-head h3{ font-size:1rem; color:#f1eddc; display:flex; align-items:center; gap:.5rem; }
  .drawer-head h3::before{ content:"◆"; font-size:.6rem; color:var(--gold); }
  .drawer-actions{ display:flex; gap:.4rem; }
  #historyList{
    list-style:none; margin:0; padding:0; overflow-y:auto; flex:1;
    display:flex; flex-direction:column; gap:.4rem;
  }
  #historyList li{
    display:flex; align-items:center; justify-content:space-between; gap:.5rem;
    border:1px solid var(--line); border-left:3px solid var(--muted);
    border-radius:8px; padding:.45rem .6rem; background:rgba(255,255,255,.02);
    font-size:.85rem;
  }
  #historyList li.p1{ border-left-color:var(--gold); }
  #historyList li.p2{ border-left-color:var(--blue); }
  #historyList .who{ font-weight:800; min-width:5.2rem; }
  #historyList .delta{ font-family:"IBM Plex Mono", monospace; font-weight:700; }
  #historyList .delta.neg{ color:#ffb3ac; }
  #historyList .delta.pos{ color:#a9e0bb; }
  #historyList .after{ font-family:"IBM Plex Mono", monospace; color:var(--muted); font-size:.78rem; }
  #historyList .time{ font-family:"IBM Plex Mono", monospace; color:var(--muted); font-size:.72rem; }
  .empty-hint{ color:var(--muted); font-size:.85rem; text-align:center; padding:1.2rem 0; }

  @media (max-width:520px){
    .bar{ gap:.4rem; }
    .icon-btn span.lbl{ display:none; }
  }
</style>
</head>
<body>

  <div class="field">
    <!-- PLAYER 2 (rotated, top) -->
    <section class="player p2" id="p2Panel">
      <span class="accent-line"></span>
      <input class="name-input" id="p2Name" value="Giocatore 2" maxlength="20">
      <div class="lp-display" id="p2LP">8000</div>
      <div class="quickrow" data-player="p2">
        <button class="qbtn dmg" data-delta="-1000">−1000</button>
        <button class="qbtn dmg" data-delta="-500">−500</button>
        <button class="qbtn dmg" data-delta="-100">−100</button>
        <button class="qbtn heal" data-delta="100">+100</button>
        <button class="qbtn heal" data-delta="500">+500</button>
        <button class="qbtn heal" data-delta="1000">+1000</button>
      </div>
      <div class="customrow">
        <button class="cbtn minus" data-player="p2" data-sign="-1">−</button>
        <input type="number" id="p2Custom" min="0" placeholder="0">
        <button class="cbtn plus" data-player="p2" data-sign="1">+</button>
      </div>
    </section>

    <!-- CENTER BAR -->
    <div class="bar">
      <div class="group">
        <button class="icon-btn" id="historyBtn" title="Cronologia danni">📜 <span class="lbl">Cronologia</span></button>
      </div>

      <div class="group">
        <span class="barlabel">Timer</span>
        <button class="icon-btn" id="timerStartPause">▶</button>
        <span class="timer" id="timerDisplay">40:00</span>
        <button class="icon-btn" id="timerReset">↺</button>
        <input type="number" class="mini-input" id="timerMinutes" min="0" max="180" value="40" title="Minuti timer">
      </div>

      <div class="group">
        <span class="barlabel">LP iniziali</span>
        <input type="number" class="mini-input" id="startingLP" min="0" step="100" value="8000">
        <button class="icon-btn primary" id="newDuelBtn">Nuovo duello</button>
      </div>
    </div>

    <!-- PLAYER 1 (normal, bottom) -->
    <section class="player p1" id="p1Panel">
      <span class="accent-line"></span>
      <div class="customrow">
        <button class="cbtn minus" data-player="p1" data-sign="-1">−</button>
        <input type="number" id="p1Custom" min="0" placeholder="0">
        <button class="cbtn plus" data-player="p1" data-sign="1">+</button>
      </div>
      <div class="quickrow" data-player="p1">
        <button class="qbtn dmg" data-delta="-1000">−1000</button>
        <button class="qbtn dmg" data-delta="-500">−500</button>
        <button class="qbtn dmg" data-delta="-100">−100</button>
        <button class="qbtn heal" data-delta="100">+100</button>
        <button class="qbtn heal" data-delta="500">+500</button>
        <button class="qbtn heal" data-delta="1000">+1000</button>
      </div>
      <div class="lp-display" id="p1LP">8000</div>
      <input class="name-input" id="p1Name" value="Giocatore 1" maxlength="20">
    </section>
  </div>

  <!-- HISTORY DRAWER -->
  <div class="overlay" id="historyOverlay">
    <div class="drawer">
      <div class="drawer-head">
        <h3>Cronologia danni</h3>
        <div class="drawer-actions">
          <button class="icon-btn" id="copyHistoryBtn">Copia</button>
          <button class="icon-btn" id="clearHistoryBtn">Pulisci</button>
          <button class="icon-btn" id="closeHistoryBtn">Chiudi</button>
        </div>
      </div>
      <ul id="historyList"></ul>
    </div>
  </div>

<script>
(function(){
  const STORAGE_KEY = 'yugioh_lp_counter_v1';
  const $ = s => document.querySelector(s);

  const st = {
    startingLP: 8000,
    p1: { name:'Giocatore 1', lp:8000 },
    p2: { name:'Giocatore 2', lp:8000 },
    history: [],           // [{player:'p1'|'p2', delta, after, ts}]
    timer: { totalSec: 40*60, remainingSec: 40*60, running:false }
  };

  let tickHandle = null;

  // DOM refs
  const p1LPEl = $('#p1LP'), p2LPEl = $('#p2LP');
  const p1NameEl = $('#p1Name'), p2NameEl = $('#p2Name');
  const startingLPEl = $('#startingLP');
  const newDuelBtn = $('#newDuelBtn');
  const timerDisplay = $('#timerDisplay');
  const timerStartPauseBtn = $('#timerStartPause');
  const timerResetBtn = $('#timerReset');
  const timerMinutesEl = $('#timerMinutes');
  const historyBtn = $('#historyBtn');
  const historyOverlay = $('#historyOverlay');
  const closeHistoryBtn = $('#closeHistoryBtn');
  const clearHistoryBtn = $('#clearHistoryBtn');
  const copyHistoryBtn = $('#copyHistoryBtn');
  const historyList = $('#historyList');

  /* ===== Persistence (a prova di storage bloccato/non disponibile) ===== */
  function safeGet(key){ try{ return localStorage.getItem(key); }catch{ return null; } }
  function safeSet(key, val){ try{ localStorage.setItem(key, val); }catch{} }
  function safeRemove(key){ try{ localStorage.removeItem(key); }catch{} }

  function saveState(){
    safeSet(STORAGE_KEY, JSON.stringify(st));
  }
  function loadState(){
    const raw = safeGet(STORAGE_KEY);
    if(!raw) return;
    try{
      const data = JSON.parse(raw);
      st.startingLP = data.startingLP ?? 8000;
      st.p1 = data.p1 || st.p1;
      st.p2 = data.p2 || st.p2;
      st.history = data.history || [];
      if (data.timer){
        st.timer.totalSec = data.timer.totalSec ?? st.timer.totalSec;
        st.timer.remainingSec = data.timer.remainingSec ?? st.timer.totalSec;
        st.timer.running = false; // non riprendere il countdown automaticamente al reload
      }
    }catch{}
  }

  /* ===== LP ===== */
  function renderLP(){
    p1LPEl.textContent = st.p1.lp;
    p2LPEl.textContent = st.p2.lp;
    p1LPEl.classList.toggle('zero', st.p1.lp <= 0);
    p2LPEl.classList.toggle('zero', st.p2.lp <= 0);
    p1NameEl.value = st.p1.name;
    p2NameEl.value = st.p2.name;
  }

  function bump(el){
    el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump');
  }

  function applyDelta(playerKey, delta){
    if (!delta) return;
    const p = st[playerKey];
    p.lp += delta;
    bump(playerKey==='p1'? p1LPEl : p2LPEl);
    st.history.push({ player: playerKey, delta, after: p.lp, ts: Date.now() });
    renderLP();
    renderHistory();
    saveState();
  }

  /* ===== History ===== */
  function fmtTime(ts){
    const d = new Date(ts);
    return d.toLocaleTimeString('it-IT', { hour:'2-digit', minute:'2-digit', second:'2-digit' });
  }

  function renderHistory(){
    historyList.innerHTML = '';
    if (!st.history.length){
      historyList.innerHTML = '<li class="empty-hint" style="border:none;background:none">Nessun evento registrato ancora.</li>';
      return;
    }
    st.history.slice().reverse().forEach(h=>{
      const li = document.createElement('li');
      li.className = h.player;
      const name = st[h.player].name || (h.player==='p1'?'Giocatore 1':'Giocatore 2');
      const sign = h.delta > 0 ? '+' : '';
      const deltaClass = h.delta > 0 ? 'pos' : 'neg';
      li.innerHTML = `
        <span class="who">${name}</span>
        <span class="delta ${deltaClass}">${sign}${h.delta}</span>
        <span class="after">→ ${h.after} LP</span>
        <span class="time">${fmtTime(h.ts)}</span>`;
      historyList.appendChild(li);
    });
  }

  /* ===== Timer ===== */
  function fmtClock(sec){
    sec = Math.max(0, sec);
    const m = Math.floor(sec/60), s = sec%60;
    return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  }

  function renderTimer(){
    timerDisplay.textContent = fmtClock(st.timer.remainingSec);
    timerDisplay.classList.toggle('amber', st.timer.remainingSec <= 300 && st.timer.remainingSec > 60);
    timerDisplay.classList.toggle('critical', st.timer.remainingSec <= 60 && st.timer.remainingSec > 0);
    timerStartPauseBtn.textContent = st.timer.running ? '⏸' : '▶';
  }

  function beep(){
    try{
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const o = ctx.createOscillator(); const g = ctx.createGain();
      o.type = 'sine'; o.frequency.value = 660;
      o.connect(g); g.connect(ctx.destination);
      g.gain.setValueAtTime(.15, ctx.currentTime);
      o.start();
      o.stop(ctx.currentTime + .35);
      setTimeout(()=>ctx.close(), 500);
    }catch{}
  }

  function tick(){
    if (!st.timer.running) return;
    st.timer.remainingSec--;
    if (st.timer.remainingSec <= 0){
      st.timer.remainingSec = 0;
      st.timer.running = false;
      clearInterval(tickHandle);
      beep();
    }
    renderTimer();
    saveState();
  }

  function startTimer(){
    if (st.timer.remainingSec <= 0) return;
    st.timer.running = true;
    tickHandle = setInterval(tick, 1000);
    renderTimer();
    saveState();
  }
  function pauseTimer(){
    st.timer.running = false;
    clearInterval(tickHandle);
    renderTimer();
    saveState();
  }
  function resetTimer(){
    pauseTimer();
    const mins = Math.max(0, parseInt(timerMinutesEl.value)||0);
    st.timer.totalSec = mins*60;
    st.timer.remainingSec = mins*60;
    renderTimer();
    saveState();
  }

  /* ===== Events ===== */
  document.querySelectorAll('.quickrow').forEach(row=>{
    row.addEventListener('click', e=>{
      const b = e.target.closest('.qbtn'); if(!b) return;
      applyDelta(row.dataset.player, parseInt(b.dataset.delta));
    });
  });

  document.querySelectorAll('.cbtn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const player = btn.dataset.player;
      const sign = parseInt(btn.dataset.sign);
      const input = $('#'+player+'Custom');
      const val = parseInt(input.value);
      if (!val) return;
      applyDelta(player, sign * Math.abs(val));
      input.value = '';
    });
  });

  p1NameEl.addEventListener('input', ()=>{ st.p1.name = p1NameEl.value || 'Giocatore 1'; saveState(); });
  p2NameEl.addEventListener('input', ()=>{ st.p2.name = p2NameEl.value || 'Giocatore 2'; saveState(); });

  startingLPEl.addEventListener('input', ()=>{
    st.startingLP = Math.max(0, parseInt(startingLPEl.value)||0);
    saveState();
  });

  newDuelBtn.addEventListener('click', ()=>{
    if (!confirm('Iniziare un nuovo duello? LP, cronologia e timer verranno azzerati.')) return;
    st.p1.lp = st.startingLP;
    st.p2.lp = st.startingLP;
    st.history = [];
    renderLP(); renderHistory();
    resetTimer();
    saveState();
  });

  timerStartPauseBtn.addEventListener('click', ()=>{
    st.timer.running ? pauseTimer() : startTimer();
  });
  timerResetBtn.addEventListener('click', resetTimer);
  timerMinutesEl.addEventListener('change', ()=>{
    if (!st.timer.running) resetTimer();
  });

  historyBtn.addEventListener('click', ()=>{ historyOverlay.classList.add('open'); });
  closeHistoryBtn.addEventListener('click', ()=>{ historyOverlay.classList.remove('open'); });
  historyOverlay.addEventListener('click', e=>{ if (e.target === historyOverlay) historyOverlay.classList.remove('open'); });
  clearHistoryBtn.addEventListener('click', ()=>{
    if (!st.history.length) return;
    if (!confirm('Cancellare tutta la cronologia?')) return;
    st.history = [];
    renderHistory(); saveState();
  });
  copyHistoryBtn.addEventListener('click', async ()=>{
    if (!st.history.length) return alert('Cronologia vuota.');
    const lines = st.history.map(h=>{
      const name = st[h.player].name;
      const sign = h.delta > 0 ? '+' : '';
      return `${fmtTime(h.ts)}  ${name}  ${sign}${h.delta} → ${h.after} LP`;
    });
    try{ await navigator.clipboard.writeText(lines.join('\n')); alert('Cronologia copiata!'); }catch{}
  });

  /* ===== Init ===== */
  loadState();
  startingLPEl.value = st.startingLP;
  timerMinutesEl.value = Math.round(st.timer.totalSec/60);
  renderLP();
  renderHistory();
  renderTimer();
})();
</script>
</body>
</html>
