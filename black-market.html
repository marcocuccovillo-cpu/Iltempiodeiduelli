 }catch(er){toast(er.message,1)}}
$app.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(b){if(b.tagName=='SELECT')return;act(b)}});
$app.addEventListener('change',async e=>{const s=e.target;if(s.dataset.act=='role'){const r=ask('Motivazione del cambio ruolo:');if(!r){route();return}try{await rpc('admin_set_role',{p_user:s.dataset.u,p_role:s.value,p_reason:r});await core();route()}catch(er){toast(er.message,1);route()}}});
async function route(){if(!me)return;const h=location.hash.replace(/^#\/?/,'').split('/'),k=h[0]||'';
 try{await (R[k]||R[''])(h[1])}catch(er){shell(`<div class="err">Qualcosa è andato storto: ${esc(er.message)}</div>`,'')}scrollTo(0,0)}
async function boot(){const{data:{session}}=await sb.auth.getSession();if(!session){me=null;authView('in');return}
 let ok;try{ok=await core()}catch(er){$app.innerHTML=`<div class="err">Impossibile contattare il database: ${esc(er.message)}. Controlla la configurazione.</div>`;return}
 if(!ok){const n=localStorage.getItem('bm.nick');if(n){try{await rpc('register_profile',{p_nickname:n});localStorage.removeItem('bm.nick');ok=await core()}catch(er){toast(er.message,1)}}}
 if(!ok){nickView();return}route()}
if(!SUPABASE_URL||!SUPABASE_ANON_KEY){setup();return}
if(!window.supabase){$app.innerHTML='<div class="err">Impossibile caricare la libreria di accesso. Controlla la connessione.</div>';return}
let base;try{base=new URL(SUPABASE_URL.trim()).origin}catch(e){$app.innerHTML='<div class="err">SUPABASE_URL non è un indirizzo valido. Deve essere nel formato https://xxxxxxxx.supabase.co, senza altro dopo.</div>';return}
sb=window.supabase.createClient(base,SUPABASE_ANON_KEY.trim(),{auth:{persistSession:true,autoRefreshToken:true}});
sb.auth.onAuthStateChange((ev)=>{if(ev==='SIGNED_IN'||ev==='SIGNED_OUT'||ev==='INITIAL_SESSION')setTimeout(boot,0)});
addEventListener('hashchange',route);
})();
</script></body></html>
