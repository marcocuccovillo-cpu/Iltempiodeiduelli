<!doctype html>
<html lang="it"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Duel Simulator — Il Tempio Dei Duelli</title><meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png?v=2" type="image/png"><link rel="apple-touch-icon" href="apple-touch-icon.png?v=2">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tempio.css?v=10">
<style>
/* Duel Simulator — tavolo digitale 1 contro 1 (usa le variabili «Ametista» di tempio.css) */
.sm-msg{margin:12px 0 0;padding:11px 13px;border-radius:12px;border:1px solid var(--ac);background:rgba(var(--ac-rgb),.12);font-weight:600;overflow-wrap:anywhere}
.sm-msg.bad{border-color:var(--bad);background:rgba(255,84,104,.1);color:#ffb3bd}.sm-msg.good{border-color:var(--good);background:rgba(74,222,155,.1);color:#b4f5d4}
.sm-h{font-size:1.15rem;margin:24px 0 10px}.sm-h:first-child{margin-top:0}
.sm-sub{color:var(--mu);font-size:.92rem;margin:-4px 0 12px}
.sm-gate{text-align:center;padding:22px 16px;margin-top:20px}.sm-gate h2{font-size:1.3rem;margin-bottom:8px}
.sm-list{display:grid;gap:0}
.sm-deck{display:grid;grid-template-columns:1fr auto;gap:6px 10px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.sm-deck:first-child{border-top:0}
.sm-deck b{overflow-wrap:anywhere}.sm-deck small{display:block;color:var(--mu);font-size:.82rem}
.sm-deck .acts{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px}
.sm-deck .acts .btn{min-height:44px;font-size:.9rem;padding:0 12px}
.sm-deck.sel{background:rgba(var(--ac-rgb),.09);margin:0 -10px;padding:12px 10px;border-radius:12px;border-top-color:transparent}
.sm-bad{color:var(--bad)}.sm-ok{color:var(--good)}
.sm-lob{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.sm-lob:first-child{border-top:0}.sm-lob small{display:block;color:var(--mu);font-size:.82rem}
.sm-pl{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.sm-pl:first-child{border-top:0}
.sm-av{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--raise);border:2px solid var(--ac);font:700 1.1rem var(--disp);color:var(--ac2)}
.sm-rdy{font-weight:700;font-size:.9rem;padding:4px 12px;border-radius:99px;border:1.5px solid var(--line);color:var(--mu)}.sm-rdy.on{color:var(--good);border-color:var(--good);background:rgba(74,222,155,.08)}
.sm-score{display:flex;justify-content:center;align-items:center;gap:14px;font:700 2rem var(--disp);margin:6px 0}
.sm-score span{color:var(--ac2)}.sm-score small{font:600 .8rem var(--ui);color:var(--mu);display:block;text-align:center}
.sm-big{display:grid;gap:10px;margin-top:14px}.sm-big .btn{min-height:56px;font-size:1.05rem}
.sm-cols{display:grid;gap:12px}@media(min-width:760px){.sm-cols{grid-template-columns:1fr 1fr}}
.sm-cr{display:grid;grid-template-columns:40px 1fr auto;gap:10px;align-items:center;padding:7px 0;border-top:1px solid var(--line)}
.sm-cr img{width:40px;height:58px;object-fit:cover;border-radius:4px;background:#111}
.sm-cr .nn{font-size:.92rem;overflow-wrap:anywhere;line-height:1.25}.sm-cr small{display:block;color:var(--mu);font-size:.78rem}
.sm-cr .qq{display:flex;gap:6px;align-items:center}.sm-cr .qq b{min-width:22px;text-align:center}
.sm-cr button{min-width:44px;min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surf);color:var(--tx);font:700 .9rem var(--ui);cursor:pointer}
.sm-cnt{display:flex;flex-wrap:wrap;gap:6px 14px;margin:8px 0;font-weight:600;font-size:.92rem}.sm-cnt span{color:var(--mu)}.sm-cnt b{color:var(--tx)}
.sm-recent{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:9px 0;border-top:1px solid var(--line)}.sm-recent:first-child{border-top:0}.sm-recent small{color:var(--mu)}

/* ===== tavolo ===== */
body.sm-tbl-on .pg>header,body.sm-tbl-on .sm-intro{display:none}
body.sm-tbl-on .pg{padding:4px 2px 8px;max-width:600px}
.sm-t{--cw:52px;--ch:76px;position:relative;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
.sm-t button{touch-action:manipulation}
.sm-bar{display:grid;grid-template-columns:minmax(0,1fr) auto auto;align-items:center;gap:2px 8px;padding:4px 8px;border:1px solid var(--line);border-radius:12px;background:var(--surf);height:58px;box-sizing:border-box}
.sm-bar.turn{border-color:var(--ac);box-shadow:0 0 14px rgba(var(--ac-rgb),.35)}
.sm-bar .who{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.sm-bar .who small{color:var(--mu);font-weight:400;margin-left:6px}
.sm-bar .cnt{display:flex;gap:6px;flex-wrap:nowrap;overflow:hidden;font-size:.74rem;color:var(--mu);grid-column:1;white-space:nowrap}
.sm-bar .cnt button{border:1px solid var(--line);border-radius:99px;background:var(--inp);color:var(--tx);font:600 .74rem var(--ui);padding:2px 8px;min-height:26px;cursor:pointer}
.sm-lp{grid-column:3;grid-row:1/3;border:1.5px solid var(--line);border-radius:12px;background:var(--inp);color:var(--tx);font:700 1.45rem var(--disp);min-width:92px;min-height:44px;font-variant-numeric:tabular-nums;cursor:pointer;padding:0 10px}
.sm-lp.low{color:var(--bad);border-color:var(--bad)}
.sm-opph{display:flex;gap:2px;height:30px;box-sizing:border-box;padding:2px 0;justify-content:center;flex-wrap:nowrap;overflow:hidden}
.sm-opph .mc{width:18px;height:26px;border-radius:2px;flex:none}
.sm-board{display:flex;flex-direction:column;gap:3px}
.sm-row{display:grid;grid-template-columns:repeat(7,var(--cw));gap:3px;justify-content:center;margin:0}
.sm-z{position:relative;width:var(--cw);height:var(--ch);border:1px dashed rgba(var(--ac-rgb),.3);border-radius:6px;background:rgba(var(--ac-rgb),.04);color:rgba(var(--mu-rgb),.6);font:600 8px/1 var(--ui);display:grid;place-items:center;padding:0;cursor:pointer;text-transform:uppercase;letter-spacing:.04em}
.sm-z.sp{border-style:solid;border-color:rgba(var(--ac-rgb),.18);background:transparent;cursor:default}
.sm-z.pick{border:2px solid var(--gold);background:rgba(232,184,74,.16);box-shadow:0 0 10px rgba(232,184,74,.5);animation:smp 1s infinite alternate;color:var(--gold)}
@keyframes smp{to{background:rgba(232,184,74,.32)}}
.sm-z.pz::after{content:"PZ";position:absolute;bottom:1px;right:3px;font-size:7px;color:var(--ac2);opacity:.8}
.sm-cd{position:absolute;inset:0;border-radius:5px;overflow:hidden;background:#15121f;border:1px solid rgba(255,255,255,.18)}
.sm-cd img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.sm-cd.def{transform:rotate(90deg) scale(.685)}
.sm-cd.mine-fd img{opacity:.5}
.sm-cd.mine-fd::after{content:"coperta";position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.65);color:#fff;font:700 8px/1.5 var(--ui);text-align:center;text-transform:uppercase}
.sm-back{background:radial-gradient(circle at 50% 50%,#7a3a1a 0 18%,#2b1710 19% 40%,#4b2a14 41% 100%);border:1px solid #8a6a2d}
.sm-back::before{content:"";position:absolute;inset:3px;border:1px solid rgba(232,184,74,.5);border-radius:3px}
.sm-tok{background:radial-gradient(circle,#6b7280,#374151);display:grid;place-items:center;font:700 .8rem var(--disp);color:#fff}
.sm-badge{position:absolute;z-index:2;min-width:16px;height:16px;padding:0 3px;border-radius:99px;font:700 10px/16px var(--ui);text-align:center;color:#120a2b;background:var(--gold);box-shadow:0 0 0 1px #000}
.sm-badge.n{right:-3px;top:-3px}.sm-badge.o{left:-3px;top:-3px;background:var(--ac2)}.sm-badge.c{right:-3px;bottom:-3px;background:var(--ac2);}
.sm-pile{position:absolute;inset:0}.sm-pile .sm-cd{inset:0}
.sm-mid{display:flex;align-items:center;justify-content:center;gap:6px;color:var(--mu);font-size:.78rem;height:20px;overflow:hidden;white-space:nowrap}
.sm-mid span{overflow:hidden;text-overflow:ellipsis}
.sm-last{margin:2px 0;padding:0 10px;border-radius:10px;background:var(--inp);border:1px solid var(--line);font-size:.84rem;color:var(--tx);height:32px;line-height:30px;box-sizing:border-box;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
.sm-last b{color:var(--ac2)}
.sm-ph{display:flex;gap:4px;align-items:center;margin:4px 0}
.sm-ph button{flex:1;min-width:0;min-height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surf);color:var(--mu);font:700 .78rem var(--ui);cursor:pointer;padding:0}
.sm-ph button.on{background:rgba(var(--ac-rgb),.22);border-color:var(--ac);color:var(--ac2)}
.sm-ph button:disabled{opacity:.55}
.sm-ph .end{flex:1.9;color:var(--tx);border-color:var(--ac);background:rgba(var(--ac-rgb),.1)}
.sm-dock{position:sticky;bottom:0;z-index:30;background:var(--bg);padding-bottom:env(safe-area-inset-bottom,0px);box-shadow:0 -8px 12px -8px #000}
.sm-hand{display:flex;gap:5px;overflow-x:auto;overflow-y:hidden;scrollbar-width:thin;padding:5px 3px 7px;min-height:calc(var(--ch) + 14px);box-sizing:border-box;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch;border-top:1px solid var(--line)}
.sm-hand .sm-hc{flex:none;position:relative;width:var(--cw);height:var(--ch);border-radius:5px;scroll-snap-align:start;padding:0;border:0;background:none;cursor:pointer}
.sm-hand .sm-hc.rev::after{content:"mostrata";position:absolute;left:0;right:0;bottom:0;background:rgba(232,184,74,.85);color:#1a1204;font:700 8px/1.5 var(--ui);text-align:center;text-transform:uppercase;border-radius:0 0 5px 5px}
.sm-tools{display:flex;gap:6px;margin:2px 0}
.sm-tools button{flex:1;min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surf);color:var(--tx);font:700 .86rem var(--ui);cursor:pointer;padding:0 4px}
.sm-ban{position:absolute;left:6px;right:6px;top:50%;transform:translateY(-50%);z-index:25;margin:0;padding:10px 12px;border-radius:12px;border:1.5px solid var(--warn);background:#20190a;box-shadow:0 10px 30px #000;display:grid;gap:8px;font-size:.92rem}
.sm-ban+.sm-ban{top:auto;bottom:6px;transform:none}
.sm-ban .row{gap:8px}.sm-ban .btn{min-height:44px;flex:1}
.sm-pickbar{position:absolute;left:0;right:0;bottom:100%;margin:0 0 4px;box-shadow:0 6px 18px #000;padding:8px 10px;border-radius:12px;border:2px solid var(--gold);background:#1c1608;color:var(--gold);display:flex;gap:10px;align-items:center;justify-content:space-between;font-weight:700}
.sm-ov{position:fixed;inset:0;z-index:2500;background:rgba(0,0,0,.72);display:flex;align-items:flex-end;justify-content:center}
.sm-sh{width:100%;max-width:600px;max-height:86dvh;overflow-y:auto;background:var(--deep);border:1px solid var(--ac);border-radius:18px 18px 0 0;padding:14px 14px calc(16px + env(safe-area-inset-bottom,0px));-webkit-overflow-scrolling:touch}
.sm-sh h3{font-size:1.1rem;margin:0 0 4px;overflow-wrap:anywhere}
.sm-sh .x{float:right;min-height:40px;min-width:40px;border-radius:10px;border:1px solid var(--line);background:none;color:var(--tx);font-size:1.2rem;cursor:pointer;margin:-4px 0 0 8px}
.sm-cinfo{display:grid;grid-template-columns:96px 1fr;gap:12px;margin:8px 0}
.sm-cinfo img{width:96px;height:140px;object-fit:cover;border-radius:6px;background:#111}
.sm-cinfo .ph{width:96px;height:140px;border-radius:6px}
.sm-cinfo p{margin:0 0 4px;font-size:.86rem;color:var(--mu)}.sm-cinfo p b{color:var(--tx)}
.sm-eff{max-height:150px;overflow-y:auto;font-size:.88rem;line-height:1.4;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--inp);white-space:pre-wrap;overflow-wrap:anywhere;margin:6px 0}
.sm-acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.sm-acts .btn{min-height:46px;font-size:.88rem;padding:0 8px;line-height:1.15;text-align:center}
.sm-acts .full{grid-column:1/-1}
.sm-acts h4{grid-column:1/-1;margin:6px 0 0;font:700 .76rem var(--ui);color:var(--mu);text-transform:uppercase;letter-spacing:.06em}
.sm-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}@media(min-width:420px){.sm-grid{grid-template-columns:repeat(5,1fr)}}
.sm-grid button{position:relative;padding:0;border:0;background:none;aspect-ratio:59/86;border-radius:5px;cursor:pointer}
.sm-grid .sm-cd{position:absolute;inset:0}
.sm-grid small{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.7);color:#fff;font:600 9px/1.3 var(--ui);padding:1px 2px;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border-radius:0 0 5px 5px}
.sm-lpb{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}.sm-lpb button{min-height:50px;border-radius:12px;border:1px solid var(--line);background:var(--surf);color:var(--tx);font:700 1.05rem var(--ui);cursor:pointer}
.sm-lpb button.m{color:var(--bad)}.sm-lpb button.p{color:var(--good)}
.sm-log{display:grid;gap:0;margin-top:8px}.sm-log div{padding:6px 0;border-top:1px solid var(--line);font-size:.88rem;line-height:1.35;overflow-wrap:anywhere}.sm-log div:first-child{border-top:0}.sm-log b{color:var(--ac2)}.sm-log small{color:var(--mu);margin-right:6px}
.sm-say{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:10px;position:sticky;bottom:0;background:var(--deep);padding-top:8px}
.sm-res{text-align:center;padding:8px 0}.sm-res h2{font-size:1.6rem;margin-bottom:6px}
.sm-toast{position:fixed;left:50%;bottom:calc(10px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:3000;max-width:min(92vw,560px);padding:10px 14px;border-radius:12px;background:#2a0f16;border:1px solid var(--bad);color:#ffd5db;font-weight:600;text-align:center}
.sm-toast.ok{background:#0e2a1d;border-color:var(--good);color:#c8f7df}
@media (prefers-reduced-motion:reduce){.sm-z.pick{animation:none}}

/* Tavolo a schermo FISSO (schermi alti almeno 600 px): la pagina non scorre mai, il campo occupa tutto lo spazio e le carte
   si ridimensionano per starci. Su schermi più bassi (telefono in orizzontale) resta la pagina che scorre, con i comandi fissi in basso. */
@media(min-height:600px){
 html.sm-tbl-on{overflow:hidden;height:100vh;height:100dvh;box-sizing:border-box;overscroll-behavior:none}
 html.sm-tbl-on body{height:100%;overflow:hidden;overscroll-behavior:none}
 html.sm-tbl-on .pg{height:100%;box-sizing:border-box;padding:4px 2px calc(4px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;overflow:hidden}
 html.sm-tbl-on #main,html.sm-tbl-on #v{display:flex;flex-direction:column;flex:1 1 auto;min-height:0}
 .sm-t{display:flex;flex-direction:column;flex:1 1 auto;min-height:0;overflow:hidden}
 .sm-t>*{flex:none}
 .sm-t>.sm-board{flex:1 1 0;min-height:0;justify-content:space-evenly;overflow:hidden}
 .sm-t.cmp .sm-opph,.sm-t.cmp .sm-mid{display:none}
 .sm-dock{position:relative;box-shadow:none;padding-bottom:0}
}
/* ===== segnali Penso / OK, chat, mischia mano ===== */
.sm-sg{grid-column:2;grid-row:1/3;display:flex;gap:5px;align-items:center;justify-content:flex-end}
.sm-sb{display:grid;place-items:center;align-content:center;gap:0;width:50px;height:46px;padding:0;border-radius:12px;border:1.5px solid var(--line);background:var(--inp);color:var(--tx);cursor:pointer;font:700 .62rem/1 var(--ui);touch-action:manipulation}
.sm-sb i{font-style:normal;font-size:1.35rem;line-height:1.1}.sm-sb b{font-weight:700;color:var(--mu);letter-spacing:.02em}
.sm-sb.on{border-color:var(--warn);background:rgba(255,209,102,.18);box-shadow:0 0 12px rgba(255,209,102,.55);animation:smb 1s infinite alternate}
.sm-sb.ok.on{border-color:var(--good);background:rgba(74,222,155,.16);box-shadow:0 0 12px rgba(74,222,155,.5)}
.sm-sb.on b{color:var(--tx)}
@keyframes smb{to{box-shadow:0 0 3px rgba(255,209,102,.2)}}
.sm-sp{display:grid;place-items:center;align-content:center;min-width:60px;height:46px;padding:0 8px;border-radius:12px;border:1.5px solid var(--warn);background:rgba(255,209,102,.16);font:700 .66rem/1 var(--ui);color:var(--tx);animation:smb 1s infinite alternate}
.sm-sp i{font-style:normal;font-size:1.4rem;line-height:1.1}
.sm-sp.ok{border-color:var(--good);background:rgba(74,222,155,.16);animation:none}
.sm-tools{position:relative}
.sm-tools button{white-space:nowrap;font-size:.8rem;letter-spacing:-.01em}
.sm-bdg{font-style:normal;position:absolute;top:-5px;right:-3px;min-width:18px;height:18px;padding:0 4px;border-radius:99px;background:var(--bad);color:#fff;font:700 11px/18px var(--ui);text-align:center;box-shadow:0 0 0 1px #000}
.sm-tools button{position:relative}
.sm-hand.shuf{animation:smh .45s}
@keyframes smh{0%{transform:translateX(0)}20%{transform:translateX(-10px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}100%{transform:none}}
.sm-note{position:fixed;left:50%;top:44%;transform:translate(-50%,-50%);z-index:2600;max-width:min(92vw,520px);display:flex;gap:10px;align-items:center;padding:12px 16px;border-radius:16px;border:2px solid var(--warn);background:#20190a;color:#fff;font-weight:700;box-shadow:0 12px 34px #000;cursor:pointer;animation:smn .25s}
.sm-note i{font-style:normal;font-size:2rem;line-height:1}.sm-note span{overflow-wrap:anywhere;font-size:1rem}.sm-note small{display:block;font-weight:600;color:#d9d2ee;font-size:.82rem}
.sm-note.ok{border-color:var(--good);background:#0b2418}.sm-note.chat{border-color:var(--ac);background:#150f2b}
@keyframes smn{from{opacity:0;transform:translate(-50%,-40%)}}
@media(min-width:720px){.sm-note{left:calc(50% + var(--menu-w,0px)/2)}}
.sm-fab{position:fixed;right:14px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:60;width:58px;height:58px;border-radius:50%;border:2px solid var(--ac);background:var(--deep);color:var(--tx);font-size:1.6rem;cursor:pointer;box-shadow:0 6px 20px #000}
.sm-chat{display:grid;gap:8px;margin-top:8px}
.sm-cl{height:min(46dvh,380px);overflow-y:auto;display:flex;flex-direction:column;gap:6px;padding:8px;border:1px solid var(--line);border-radius:12px;background:var(--inp);-webkit-overflow-scrolling:touch}
.sm-cl .m{max-width:84%;padding:7px 11px;border-radius:14px;border:1px solid var(--line);background:var(--surf);overflow-wrap:anywhere;line-height:1.35;font-size:.95rem;align-self:flex-start;border-bottom-left-radius:4px}
.sm-cl .m.me{align-self:flex-end;background:rgba(var(--ac-rgb),.22);border-color:var(--ac);border-radius:14px;border-bottom-right-radius:4px}
.sm-cl .m small{display:block;color:var(--mu);font-size:.72rem;margin-bottom:1px}
.sm-cl .e{margin:auto;color:var(--mu);text-align:center;font-size:.9rem}
.sm-cin{display:grid;grid-template-columns:1fr auto;gap:8px}
.sm-cin input{min-height:46px}.sm-cin .btn{min-height:46px}
.sm-cerr{margin:0;color:var(--bad);font-size:.86rem}
@media (prefers-reduced-motion:reduce){.sm-sb.on,.sm-sp,.sm-hand.shuf,.sm-note{animation:none}}

/* ===== menu compatti, effetti e catene (v41) ===== */
.sm-sh{padding:10px 12px calc(12px + env(safe-area-inset-bottom,0px));max-height:82dvh}
.sm-sh h3{font-size:1rem;margin:0 0 2px;line-height:1.25}
.sm-sh .x{min-height:34px;min-width:34px;font-size:1.05rem;margin:-2px 0 0 6px}
.sm-cinfo{grid-template-columns:62px 1fr;gap:10px;margin:6px 0 4px}
.sm-cinfo img,.sm-cinfo .ph{width:62px;height:90px}
.sm-cinfo p{margin:0 0 2px;font-size:.8rem;line-height:1.3}
.sm-cinfo>div{min-width:0}
.sm-eff{max-height:calc(1.3em*3 + 10px);overflow:hidden;font-size:.78rem;line-height:1.3;padding:4px 7px;margin:3px 0 0;cursor:pointer;position:relative}

/* ---------- caricamento stato e polling ---------- */
function codesOf(st){const c=[];(st.cards||[]).forEach(x=>{if(x.x>0)c.push(x.x)});(st.chain||[]).forEach(k=>{if(k.x>0)c.push(k.x)});(st.log||[]).forEach(e=>{const d=e.data||{};if(d.x>0)c.push(d.x);(d.codes||[]).forEach(x=>{if(x>0)c.push(x)})});return c}
function applyState(st){if(!st||st.same)return false;const first=!S;S=st;needThen(codesOf(st));return true}
async function loadState(){const st=await rpc('sim_state',{p_lobby:LID,p_since:null});S=st;needThen(codesOf(st));if(HOME===null||st.lobby.status==='lobby')await refreshHomeQuiet();render()}
async function refreshHomeQuiet(){try{HOME=await rpc('sim_home')}catch(_){}}
function render(){
 if(!S){renderHome();updateFab();return}
 chatSync();sigSync();
 const st=S.lobby.status,g=S.game;
 if(st==='lobby')renderLobby();
 else if(st==='playing'&&g&&g.status==='choosing')renderChoose();
 else if(st==='playing')renderTable();
 else if(st==='siding')renderSiding();
 else renderEnd();
 updateFab()}
function refreshAll(){render()}
let pollMs=0;
function stopPoll(){clearInterval(tmr);tmr=null;pollMs=0}
function startPoll(){const ms=LID?(view==='table'?1500:2500):5000;if(tmr&&pollMs===ms)return;clearInterval(tmr);pollMs=ms;tmr=setInterval(poll,ms)}
async function poll(){
 if(document.hidden||pollBusy||busy)return;pollBusy=true;
 try{
  if(LID){const st=await rpc('sim_state',{p_lobby:LID,p_since:S?S.v:null});if(applyState(st)){if(S.lobby.status==='lobby')await refreshHomeQuiet();render()}}
  else{const h=await rpc('sim_home');const ch=JSON.stringify(h.lobbies)+JSON.stringify(h.recent);const old=HOME?JSON.stringify(HOME.lobbies)+JSON.stringify(HOME.recent):'';HOME=h;if(h.mine){LID=h.mine;await loadState();return}if(ch!==old&&view==='home'){$('hL').innerHTML=homeLobbies();$('hR').innerHTML=homeRecent()}}
 }catch(e){if(/Modulo non attivo/i.test(String(e.message)))gateOff();else if(/Non partecipi/.test(String(e.message))){LID=null;S=null;SDkey='';say('Non fai più parte di quella lobby.');await loadHome()}}
 finally{pollBusy=false}}
document.addEventListener('visibilitychange',()=>{if(!document.hidden){clearInterval(tmr);tmr=null;poll();if(view)startPoll()}});

const ZN={hand:'Mano',deck:'Deck',extra:'Extra Deck',mz:'Zona Mostro',emz:'Zona Mostro Extra',st:'Zona Magia/Trappola',fz:'Zona Terreno',gy:'Cimitero',banish:'Rimosse dal gioco',ovl:'Materiale'};

const PHN=Object.fromEntries(PH.map(p=>[p[0],p[2]]));
let PICK=null,SHOWN=null,PK=null,lastHandScroll=0,lastSeenN=0;
const nick=seat=>{const p=S.players.find(x=>x.seat===seat);return p?p.nickname:'?'};
const cardName=x=>x==null?'una carta':(x===0?'Segnalino':`<b>${esc(ci(x).n)}</b>`);

/* ---------- mappa del tavolo ---------- */
function board(){const M={},pile={gy:{1:[],2:[]},banish:{1:[],2:[]},extra:{1:[],2:[]}},ovl={};
 S.cards.forEach(c=>{
  if(c.z==='mz'||c.z==='st'||c.z==='fz')M[c.z+':'+c.c+':'+c.s]=c;
  else if(c.z==='emz')M['emz:0:'+c.s]=c;
  else if(c.z==='gy'||c.z==='banish'||c.z==='extra')pile[c.z][c.o].push(c);
  else if(c.z==='ovl'){(ovl[c.h]=ovl[c.h]||[]).push(c)}});
 Object.values(pile).forEach(p=>[1,2].forEach(o=>p[o].sort((a,b)=>a.k-b.k)));
 return{M,pile,ovl}}
function cdHtml(c,B,pileBadge){
 const known=c.x!=null,tok=c.x===0,mineFd=known&&!c.f&&c.z!=='hand'&&c.z!=='gy'&&c.z!=='banish'&&c.z!=='extra';
 const cls=['sm-cd',c.p==='def'&&(c.z==='mz'||c.z==='emz')?'def':'',known?'':'sm-back',tok?'sm-tok':'',mineFd?'mine-fd':''].filter(Boolean).join(' ');
 const ov=B&&B.ovl[c.i]?B.ovl[c.i].length:0;
 const ch=(S.chain||[]).filter(k=>k.i===c.i&&!k.res).map(k=>k.n);
 return `<span class="${cls}" data-cid="${c.i}">${tok?'T':known?cardImg(c.x):''}</span>`+(c.n>0?`<span class="sm-badge n">${c.n}</span>`:'')+(ov?`<span class="sm-badge o" title="Materiali">${ov}</span>`:'')+(ch.length?`<span class="sm-badge ch" title="In catena">C${ch.join('·')}</span>`:'')+(pileBadge?`<span class="sm-badge c">${pileBadge}</span>`:'')}
function pickOk(zone,side,slot,c){if(!PICK)return false;if(PICK.kind==='host')return !!c&&(zone==='mz'||zone==='emz');
 if(PICK.zone!==zone)return false;if(zone==='emz')return !c;return side===S.me.seat&&!c}
function zoneBtn(B,side,zone,slot,label){const key=zone+':'+(zone==='emz'?0:side)+':'+slot,c=B.M[key],pk=pickOk(zone,side,slot,c);
 const pz=zone==='st'&&(slot===1||slot===5)?' pz':'';
 return `<button class="sm-z${pk?' pick':''}${pz}" data-zone="${zone}" data-side="${side}" data-slot="${slot}" aria-label="${esc(ZN[zone])} ${slot}${side===S.me.seat?'':' avversario'}${c?': '+(c.x!=null?ci(c.x).n:'carta coperta'):' libera'}">${c?cdHtml(c,B):label}</button>`}
function pileBtn(B,side,kind){let inner='',n=0;const cnt=(S.counts[side]||{});
 if(kind==='deck'){n=cnt.deck||0;inner=n?`<span class="sm-cd sm-back"></span><span class="sm-badge c">${n}</span>`:'DECK'}
 else if(kind==='extra'){n=cnt.extra||0;inner=n?`<span class="sm-cd sm-back"></span><span class="sm-badge c">${n}</span>`:'EX'}
 else if(kind==='gy'){const a=B.pile.gy[side];n=a.length;inner=n?cdHtml(a[a.length-1],null,n):'GY'}
 return `<button class="sm-z" data-pile="${kind}" data-side="${side}" aria-label="${kind==='deck'?'Deck':kind==='extra'?'Extra Deck':'Cimitero'}${side===S.me.seat?'':' avversario'}: ${n} carte">${inner}</button>`}
function rowMonsters(B,side){const me=side===S.me.seat,cells=[zoneBtn(B,side,'fz',1,'FZ'),...[1,2,3,4,5].map(i=>zoneBtn(B,side,'mz',i,'MZ')),pileBtn(B,side,'gy')];return `<div class="sm-row">${(me?cells:cells.reverse()).join('')}</div>`}
function rowSpells(B,side){const me=side===S.me.seat,cells=[pileBtn(B,side,'extra'),...[1,2,3,4,5].map(i=>zoneBtn(B,side,'st',i,'ST')),pileBtn(B,side,'deck')];return `<div class="sm-row">${(me?cells:cells.reverse()).join('')}</div>`}
function rowEmz(B){const me=S.me.seat,a=zoneBtn(B,0,'emz',1,'EMZ'),b=zoneBtn(B,0,'emz',2,'EMZ'),sp='<span class="sm-z sp" aria-hidden="true"></span>';
 return `<div class="sm-row">${sp}${sp}${me===1?a:b}${sp}${me===1?b:a}${sp}${sp}</div>`}
function barHtml(side,B){const me=side===S.me.seat,p=S.players.find(x=>x.seat===side)||{},cnt=S.counts[side]||{},g=S.game,lp=g.lp[side-1],turn=g.turn_seat===side;
 const bn=B.pile.banish[side].length,opn=esc(((oppP()||{}).nickname)||'l’avversario'),ms=sigNow(S.me.seat);
 const sg=me?`<div class="sm-sg"><button class="sm-sb${ms==='think'?' on':''}" data-a="sigThink" aria-pressed="${ms==='think'}" aria-label="Penso: avvisa ${opn} che stai pensando (tocca di nuovo per spegnere)" title="Penso"><i>🤔</i><b>Penso</b></button><button class="sm-sb ok${ms==='ok'?' on':''}" data-a="sigOk" aria-label="OK: avvisa ${opn} che puoi procedere" title="OK"><i>👍</i><b>OK</b></button></div>`
  :`<div class="sm-sg" data-sigbox="${side}">${pillHtml(side)}</div>`;
 return `<div class="sm-bar${turn?' turn':''}"><div class="who">${esc(p.nickname)}${me?'<small>tu</small>':''}${turn?'<small>● turno</small>':''}</div>${sg}
 <button class="sm-lp${lp<=2000?' low':''}" data-lp="${side}" aria-label="Punti vita di ${esc(p.nickname)}: ${lp}. Tocca per modificarli">${num(lp)}</button>
 <div class="cnt"><span>Mano ${cnt.hand||0}</span><button data-pile="banish" data-side="${side}">Rimosse ${bn}</button>${me?'':`<button data-pile="extra" data-side="${side}">Extra ${cnt.extra||0}</button>`}</div></div>`}
function oppHand(B){const o=3-S.me.seat,n=(S.counts[o]||{}).hand||0,rev=S.cards.filter(c=>c.z==='hand'&&c.o===o);let h='';
 const show=Math.min(n,14);for(let i=0;i<show;i++){const r=rev[i];h+=r&&r.x!=null?`<span class="mc sm-cd" style="position:relative;width:18px;height:26px;display:block"><img src="${imgSrc(r.x)}" alt="" referrerpolicy="no-referrer" style="width:100%;height:100%;object-fit:cover"></span>`:'<span class="mc sm-cd sm-back" style="position:relative;display:block"></span>'}
 return `<div class="sm-opph" aria-label="Mano dell’avversario: ${n} carte">${h}</div>`}
function logLine(e){const d=e.data||{},who=`<b>${esc(nick(e.seat))}</b>`,z=k=>ZN[k]||k;
 switch(e.kind){
  case 'start':return `Duello ${d.no}: gioca per primo <b>${esc(nick(d.first))}</b>. 8000 LP, 5 carte a testa.`;
  case 'choose':return `Duello ${d.no}: <b>${esc(nick(e.seat))}</b> sceglie chi inizia.`;
  case 'draw':return `${who} pesca ${d.n} ${d.n===1?'carta':'carte'}.`;
  case 'deckout':return `${who} non può pescare: il deck è vuoto.`;
  case 'move':{const own=d.o!==e.seat?` (di ${esc(nick(d.o))})`:'';const to=d.to==='deck'?'Deck':z(d.to);
   const face=(d.to==='mz'||d.to==='emz')?(d.f?(d.p==='def'?' in difesa':' in attacco'):' coperta in difesa'):(d.to==='st'||d.to==='fz')?(d.f?' scoperta':' coperta'):d.to==='banish'&&!d.f?' coperta':'';
   return `${who}: ${cardName(d.x)}${own} — ${z(d.from)} → ${to}${face}${d.sh?' <i>(deck mescolato)</i>':''}.`}
  case 'set':{const what=d.p&&(d.z==='mz'||d.z==='emz')?(d.f?(d.p==='def'?'in difesa':'in attacco'):'coperta in difesa'):(d.f?'scoperta':'coperta');return `${who} porta ${cardName(d.x)} ${what}.`}
  case 'lp':{const dl=d.to-d.from;return `Punti vita di <b>${esc(nick(d.t))}</b>: ${num(d.from)} → <b>${num(d.to)}</b> (${dl>0?'+':''}${num(dl)}).`}
  case 'phase':return `${who} passa alla ${PHN[d.phase]||d.phase}.`;
  case 'turn':return `Turno ${d.turn}: tocca a <b>${esc(nick(d.seat))}</b>.`;
  case 'shuffle':return `${who} mescola il proprio deck.`;
  case 'shuffle_hand':return `${who} mescola la propria mano.`;
  case 'search':return `${who} consulta il proprio deck.`;
  case 'peek':return `${who} guarda le prime ${d.n} carte del proprio deck.`;
  case 'reorder':return `${who} rimette ${d.n} ${d.n===1?'carta':'carte'} ${d.bottom?'in fondo al':'in cima al'} deck.`;
  case 'top':return `${who} manda le prime ${d.n} carte del deck ${d.to==='gy'?'nel Cimitero':'tra le carte rimosse'}${d.f?'':' (coperte)'}${d.codes?`: ${d.codes.map(cardName).join(', ')}`:''}.`;
  case 'coin':return `${who} lancia ${d.r.length>1?d.r.length+' monete':'una moneta'}: <b>${d.r.map(x=>x?'Testa':'Croce').join(', ')}</b>.`;
  case 'dice':return `${who} tira ${d.r.length>1?d.r.length+' dadi':'un dado'}: <b>${d.r.join(', ')}</b>.`;
  case 'say':return `${who}: «${esc(d.t)}»`;
  case 'token':return `${who} evoca un segnalino.`;
  case 'counter':return `${who}: ${cardName(d.x)} ${d.d>0?'+':''}${d.d} segnalini (ora ${d.n}).`;
  case 'reveal':return `${who} mostra ${cardName(d.x)} dalla mano.`;

 const byW=(t.clientWidth-6*3-2)/7,gap=3;
 t.classList.remove('cmp');
 if(!(window.matchMedia&&matchMedia('(min-height:600px)').matches)){const cw=Math.max(34,Math.min(52,Math.floor(byW)));t.style.setProperty('--cw',cw+'px');t.style.setProperty('--ch',Math.round(cw*1.46)+'px');return}
 const meas=()=>{t.style.setProperty('--cw','34px');t.style.setProperty('--ch','50px');   /* misura con carte piccole: il campo non è mai schiacciato */
  const extra=hd.offsetHeight-50,fixed=t.clientHeight-bd.clientHeight-hd.offsetHeight;return(t.clientHeight-fixed-extra-4*gap)/(6*1.46)};

 if(byH<40){t.classList.add('cmp');byH=meas()}   /* schermo basso: tolgo la mano dell'avversario e la riga d'informazioni */
 const cw=Math.max(30,Math.floor(Math.min(byH,byW)));

 const sh=sheet(`${xBtn()}<h3>⛓ Catena · ${ch.length} ${ch.length===1?'anello':'anelli'}</h3><p class="sm-sub" style="margin:0;font-size:.8rem">Si risolve al contrario: l’ultimo dichiarato per primo. Per aggiungere un anello tocca una carta e scegli ⚡.</p>
  <div class="sm-ch">${rows}</div><div class="sm-ac3"><button class="btn full" data-ch="res">▶ Risolvi la Catena ${top.n}</button><button class="btn danger full" data-ch="clr">✕ Annulla tutta la catena</button></div>`,{label:'Catena'});
 SHOWN={kind:'chain'};
 sh.querySelector('[data-ch=res]').onclick=function(){act(this,async()=>{await call('sim_chain_resolve')})};
 sh.querySelector('[data-ch=clr]').onclick=()=>{confirmSheet('Annullare la catena?','Tutti gli anelli vengono cancellati. Usalo se hai dichiarato per sbaglio.','Sì, annulla',async()=>{await call('sim_chain_clear')})}}

let FXKEY=null,FXN=0,fxT=null;
function fxSync(){if(!S||!S.log||!S.lobby)return;
 const mx=S.log.length?S.log[S.log.length-1].n:0,key=LID+':'+S.lobby.game_no;
 if(FXKEY!==key){FXKEY=key;FXN=mx;FXHINT=null;return}
 const fresh=S.log.filter(e=>e.n>FXN&&e.kind==='activate');
 FXN=Math.max(FXN,mx);
 fresh.forEach((e,ix)=>fxPlay(e,ix===fresh.length-1))}
function fxPlay(e,pop){const d=e.data||{},mine=e.seat===S.me.seat;
 const k=(S.chain||[]).find(k=>k.n===d.n&&k.x===d.x&&k.seat===e.seat);
 let cid=k&&k.i!=null?k.i:null;
 if(mine){if(cid==null)cid=FXHINT;FXHINT=null}
 if(cid!=null)fxGlow(cid);
 if(pop)fxPop(e,mine)}
function fxGlow(cid){const el=document.querySelector('.sm-t [data-cid="'+cid+'"]');if(!el)return;
 const r=(el.closest('button')||el).getBoundingClientRect();if(!r.width||!r.height)return;
 const g=document.createElement('div');g.className='sm-glow';g.style.cssText=`left:${r.left}px;top:${r.top}px;width:${r.width}px;height:${r.height}px`;
 document.body.appendChild(g);setTimeout(()=>g.remove(),1400)}
function fxPop(e,mine){const d=e.data||{};
 const show=()=>{const old=$('fx');if(old)old.remove();
  const f=document.createElement('div');f.id='fx';f.className='sm-fx';f.setAttribute('role','status');
  f.innerHTML=`${d.x>0?cardImg(d.x):''}<div><span class="chn">⛓ CATENA ${d.n}</span><b>${esc(ci(d.x).n)}</b><small>${mine?'Hai dichiarato l’effetto':esc(nick(e.seat))+' dichiara l’effetto'}</small></div>`;
  const bd=document.querySelector('.sm-board');if(bd){const r=bd.getBoundingClientRect();if(r.height)f.style.top=Math.round(r.top+r.height/2)+'px'}
  document.body.appendChild(f);clearTimeout(fxT);fxT=setTimeout(()=>{f.remove()},2300);
  if(!mine){ping(880);buzz()}};
 if(d.x>0&&!CARDS[d.x]){Promise.race([need([d.x]),new Promise(r=>setTimeout(r,1500))]).then(show,show)}else show()}

let SOUND=true;try{SOUND=localStorage.getItem('tempio.sim.sound')!=='0'}catch(_){}
let AC=null;
function ping(freq){if(!SOUND)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();const o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.value=freq;g.gain.value=.06;o.connect(g);g.connect(AC.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+.28);o.stop(AC.currentTime+.3)}catch(_){}}
function buzz(){if(!SOUND)return;try{if(navigator.vibrate)navigator.vibrate([90,50,90])}catch(_){}}
let noteT=null;
function note(icon,html,cls,fn){const e=$('note');e.className='sm-note'+(cls?' '+cls:'');e.innerHTML=`<i aria-hidden="true">${icon}</i><span>${html}</span>`;e.hidden=false;e.onclick=()=>{e.hidden=true;if(fn)fn()};clearTimeout(noteT);noteT=setTimeout(()=>{e.hidden=true},cls==='chat'?5000:3800)}

/* segnali: per ogni giocatore ricordo l'ultimo segnale visto e quando scade (l'orologio è del browser, l'età la dà il database) */
let SIGSEEN={},SIGDL={},SIGLID=null,sigT=null;
const SIGLIFE={think:300,ok:12};
function sigSync(){if(!S||!S.players)return;
 if(SIGLID!==LID){SIGLID=LID;SIGSEEN={};SIGDL={}}
 const now=Date.now();
 S.players.forEach(p=>{const n=p.sig_n||0,first=SIGSEEN[p.seat]===undefined,d=SIGDL[p.seat];
  if(!d||d.n!==n){SIGDL[p.seat]={n,k:p.sig||null,until:p.sig?now+Math.max(0,(SIGLIFE[p.sig]-(p.sig_age||0)))*1000:0};
   if(p.sig&&p.seat!==S.me.seat&&(!first||(p.sig_age||0)<=10)){
    const nn=esc(p.nickname||'L’avversario');
    if(p.sig==='think'){note('🤔',`${nn} sta pensando…<small>Aspetta un attimo</small>`,'');ping(520)}
    else{note('👍',`${nn}: OK<small>Puoi procedere</small>`,'ok');ping(780)}
    buzz()}}
  else if(!p.sig&&d.k){d.k=null}
  SIGSEEN[p.seat]=n})}
function sigNow(seat){const d=SIGDL[seat];return d&&d.k&&Date.now()<d.until?d.k:null}
function pillHtml(seat){const k=sigNow(seat);return k==='think'?'<span class="sm-sp" role="status"><i>🤔</i>Pensa…</span>':k==='ok'?'<span class="sm-sp ok" role="status"><i>👍</i>OK</span>':''}
/* quando un segnale scade aggiorno solo i bottoni, senza ridisegnare il tavolo */
function sigTick(){clearTimeout(sigT);const now=Date.now();let next=0;
 Object.values(SIGDL).forEach(d=>{if(d.k&&d.until>now&&(!next||d.until<next))next=d.until});
 if(next)sigT=setTimeout(()=>{if(view==='table'&&S){LASTH='';render()}},next-now+60)}

/* chat */
let CHATLID=null,CHATN=0,CHATNOT=0;
const chatKey=()=>'tempio.sim.chat.'+LID;
function chatList(){return(S&&S.chat)||[]}
function chatOpen(){return !!(SHOWN&&SHOWN.kind==='chat')}
function chatUnread(){if(!S||!S.me)return 0;return chatList().filter(m=>m.n>CHATN&&m.seat!==S.me.seat).length}
function chatSave(){try{localStorage.setItem(chatKey(),String(CHATN))}catch(_){}}
function chatSync(){if(!S||!S.me||!LID)return;
 const m=chatList(),mx=m.length?m[m.length-1].n:0;
 if(CHATLID!==LID){CHATLID=LID;let v=null;try{v=localStorage.getItem(chatKey())}catch(_){}
  CHATN=v==null?mx:Math.min(+v||0,mx);CHATNOT=mx;chatSave()}
 if(chatOpen()){CHATN=mx;CHATNOT=mx;chatSave();chatRefresh();return}
 const fresh=m.filter(x=>x.n>CHATNOT&&x.seat!==S.me.seat);
 CHATNOT=Math.max(CHATNOT,mx);
 if(fresh.length){const f=fresh[fresh.length-1];
  note('💬',`<b>${esc(nick(f.seat))}</b><small>${esc(f.t.length>90?f.t.slice(0,90)+'…':f.t)}</small>`,'chat',openChat);ping(660);buzz()}}
function updateFab(){const f=$('chatFab');if(!f)return;
 const show=!!(S&&S.me&&LID&&(view==='lobby'||view==='choose'||view==='siding'));
 f.hidden=!show;const b=f.querySelector('.sm-bdg'),u=show?chatUnread():0;b.hidden=!u;b.textContent=u>9?'9+':u}
function hhmm(ts){const d=new Date(ts*1000);return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}
function chatScroll(){const go=()=>{const l=$('chatL');if(!l)return;l.scrollTop=l.scrollHeight;const sh=l.closest('.sm-sh');if(sh)sh.scrollTop=sh.scrollHeight};
 go();requestAnimationFrame(go);setTimeout(go,120);setTimeout(go,420)}
function chatRefresh(force){const l=$('chatL');if(!l)return;
 const m=chatList(),me=S.me.seat;
 const html=m.length?m.map(x=>`<div class="m${x.seat===me?' me':''}"><small>${x.seat===me?'Tu':esc(nick(x.seat))} · ${hhmm(x.ts)}</small>${esc(x.t)}</div>`).join(''):'<p class="e">Nessun messaggio.<br>Scrivi tu per primo!</p>';
 const changed=l.dataset.h!==html;
 if(changed){l.dataset.h=html;l.innerHTML=html}
 if(changed||force)chatScroll()}
function openChat(){if(!S||!S.me)return;
 const opn=(oppP()||{}).nickname||'l’avversario';
 sheet(`${xBtn()}<h3>Chat con ${esc(opn)}</h3><div class="sm-chat"><div class="sm-cl" id="chatL" role="log" aria-live="polite"></div><p class="sm-cerr" id="chatE" hidden></p>
  <div class="sm-cin"><input id="chatT" maxlength="200" placeholder="Scrivi un messaggio" enterkeyhint="send" autocomplete="off" aria-label="Messaggio"><button class="btn" id="chatB" type="button">Invia</button></div></div>`,{label:'Chat'});
 SHOWN={kind:'chat'};const m=chatList();CHATN=m.length?m[m.length-1].n:0;CHATNOT=CHATN;chatSave();
 chatRefresh(true);updateFab();
 if(view==='table'){LASTH='';render()}
 const send=()=>{const i=$('chatT'),t=i.value.trim();if(!t)return;
  act($('chatB'),async()=>{const e=$('chatE');e.hidden=true;
   try{i.value='';await call('sim_chat_send',{p_text:t})}catch(er){i.value=t;e.textContent=String(er.message||er);e.hidden=false}
   const c=$('chatT');if(c)c.focus()})};
 $('chatB').onclick=send;$('chatT').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();send()}};
 $('chatT').addEventListener('focus',()=>{chatScroll()});
 if(window.matchMedia&&matchMedia('(pointer:fine)').matches)$('chatT').focus()}
$('chatFab').onclick=openChat;
/* tastiera che si apre/chiude o schermo che ruota: resto sull'ultimo messaggio */
window.addEventListener('resize',()=>{if(chatOpen())chatScroll()});
if(window.visualViewport)window.visualViewport.addEventListener('resize',()=>{if(chatOpen())chatScroll()});

/* =====================================================================
   EVENTI E AVVIO
   ===================================================================== */
function confirmSheet(title,msg,okLabel,fn){const sh=sheet(`${xBtn()}<h3>${esc(title)}</h3><p>${msg}</p><div class="sm-acts"><button class="btn danger" id="cfOk">${esc(okLabel)}</button><button class="btn ghost" data-close="1">Annulla</button></div>`,{label:title});
 $('cfOk').onclick=()=>act($('cfOk'),async()=>{closeSheet();await fn()})}
function leaveFlow(btn){const st=S&&S.lobby.status;
 if(st==='playing'||st==='siding'){confirmSheet('Abbandonare l’incontro?','Perderai l’intero incontro e uscirai dalla partita.','Sì, abbandono',async()=>{await rpc('sim_lobby_leave',{p_lobby:LID});await loadState()});return}
 act(btn,async()=>{await rpc('sim_lobby_leave',{p_lobby:LID});LID=null;S=null;SDkey='';say('Sei uscito dalla lobby.');await loadHome()})}
async function goHome(){LID=null;S=null;SDkey='';PICK=null;SHOWN=null;closeSheet();tblMode(false);SIGSEEN={};SIGDL={};SIGLID=null;CHATLID=null;$('v').dataset.k='';await loadHome()}
function renameSheet(d){const sh=sheet(`${xBtn()}<h3>Rinomina il deck</h3><label for="rnN">Nome</label><input id="rnN" maxlength="40" value="${esc(d.name)}"><button class="btn block" id="rnGo" style="margin-top:10px">Salva</button>`,{label:'Rinomina'});
 $('rnGo').onclick=()=>act($('rnGo'),async()=>{await rpc('sim_deck_save',{p_id:d.id,p_name:$('rnN').value,p_main:d.main,p_extra:d.extra,p_side:d.side,p_temp:false});closeSheet();say('Deck rinominato.','good');await loadHome();if(LID)await loadState()})}

document.addEventListener('click',e=>{
 const t=e.target;if(!t.closest)return;
 const bg=t.closest('[data-ovbg]');if(bg&&t===bg){closeSheet();return}
 if(t.closest('[data-close]')){closeSheet();return}
 const bk=t.closest('[data-back]');if(bk&&NEXTBACKFN){const f=NEXTBACKFN;f();return}
 if(t.closest('#ov'))return;
 if(view==='table'&&t.closest('#v')){tableClick(t);return}
 const b=t.closest('button,label');if(!b)return;
 const id=b.id;
 if(id==='retry'){boot();return}
 if(id==='newL'){act(b,async()=>{LID=await rpc('sim_lobby_create',{p_title:($('newT').value||'').trim()||null});say('');await loadState()});return}
 if(b.dataset.join){act(b,async()=>{const l=+b.dataset.join;await rpc('sim_lobby_join',{p_lobby:l});LID=l;say('');await loadState()});return}
 if(b.dataset.dren){const d=HOME.decks.find(x=>x.id===b.dataset.dren);if(d)renameSheet(d);return}
 if(b.dataset.ddel){const d=HOME.decks.find(x=>x.id===b.dataset.ddel);if(d)confirmSheet('Eliminare il deck?',`Il deck <b>${esc(d.name)}</b> verrà cancellato dalla tua libreria.`,'Elimina',async()=>{await rpc('sim_deck_delete',{p_id:d.id});say('Deck eliminato.');await loadHome();if(LID)await loadState()});return}
 if(b.dataset.dan){const d=HOME.decks.find(x=>x.id===b.dataset.dan);if(d){try{localStorage.setItem(KD,JSON.stringify({name:d.name,main:collapse(d.main),extra:collapse(d.extra),side:collapse(d.side)}));localStorage.setItem(KSIM,d.id)}catch(_){}location.href='deck-analyzer.html'}return}
 if(id==='impAn'){const d=readAnalyzer();if(d)impStart(d);else say('Nel Deck Analyzer non c’è nessun deck.','bad');return}
 if(id==='impPaste'){const d=parseYdk(($('impTxt')||{}).value||'');if(d.main.length+d.extra.length+d.side.length===0){say('Non ho trovato nessuna carta: incolla il contenuto di un file .ydk.','bad');return}d.name='Deck incollato';impStart(d);return}
 if(id==='impCancel'){IMP=null;impPreview();return}
 if(id==='impSave'){act(b,()=>impSave(false));return}
 if(id==='impTemp'){act(b,()=>impSave(true));return}
 if(b.dataset.pick){act(b,async()=>{await rpc('sim_set_deck',{p_lobby:LID,p_deck:b.dataset.pick});await loadState()});return}
 if(id==='lbReady'||id==='sdReady'){act(b,async()=>{const r=!myP().ready;S=await rpc('sim_set_ready',{p_lobby:LID,p_ready:r});needThen(codesOf(S));render()});return}
 if(id==='lbStart'){act(b,async()=>{S=await rpc('sim_start',{p_lobby:LID});render()});return}
 if(id==='lbKick'){act(b,async()=>{S=await rpc('sim_lobby_kick',{p_lobby:LID});render()});return}
 if(id==='lbLeave'){leaveFlow(b);return}
 if(b.dataset.first){act(b,async()=>{S=await rpc('sim_choose_first',{p_lobby:LID,p_first:+b.dataset.first});needThen(codesOf(S));render()});return}
 if(b.dataset.sd){const[from,to,cid]=b.dataset.sd.split(':'),c=+cid,i=SD[from].indexOf(c);if(i>=0){SD[from].splice(i,1);SD[to].push(c);renderSiding()}return}
 if(id==='sdReset'){SD={main:[...S.me.cfg.main],extra:[...S.me.cfg.extra],side:[...S.me.cfg.side]};renderSiding();return}
 if(id==='sdApply'){act(b,async()=>{S=await rpc('sim_side',{p_lobby:LID,p_main:SD.main,p_extra:SD.extra,p_side:SD.side});SDkey='';say('Side applicato.','good');render()});return}
 if(id==='backHome'){goHome();return}
});
document.addEventListener('change',e=>{const f=e.target;if(f&&f.id==='impFile'&&f.files&&f.files[0]){const file=f.files[0];file.text().then(txt=>{const d=parseYdk(txt);if(d.main.length+d.extra.length+d.side.length===0){say('Il file non contiene carte: serve un .ydk valido.','bad');return}d.name=file.name.replace(/\.(ydk|txt)$/i,'')||'Deck';impStart(d)});f.value=''}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&sheetOpen())closeSheet();if((e.key==='Enter'||e.key===' ')&&e.target&&e.target.classList&&e.target.classList.contains('sm-last')){e.preventDefault();openLog()}if((e.key==='Enter'||e.key===' ')&&e.target&&e.target.classList&&e.target.classList.contains('ct')){e.preventDefault();chainSheet()}});
let rsT=null;window.addEventListener('resize',()=>{clearTimeout(rsT);rsT=setTimeout(()=>{if(view==='table'&&S){LASTH='';render()}},120)});


async function boot(){
 if(!window.supabase){gate('<section class="card sm-gate"><h2>Collegamento non riuscito</h2><p class="mute">Impossibile caricare la libreria di accesso. Controlla la connessione e riprova.</p><button class="btn ghost" id="retry">Riprova</button></section>');return}
 try{
  if(!sb){sb=window.supabase.createClient(new URL(SUPABASE_URL).origin,SUPABASE_ANON_KEY,{auth:{persistSession:true,autoRefreshToken:true}});
   sb.auth.onAuthStateChange(ev=>{if(ev==='SIGNED_OUT')gateLogin()})}
  const{data:{session}}=await sb.auth.getSession();
  if(!session){gateLogin();return}
  ME=session.user.id;
  const pr=await sb.from('profiles').select('id').eq('id',ME).maybeSingle();
  if(!pr.data){gate('<section class="card sm-gate"><h2>Completa il profilo</h2><p class="mute">Il tuo accesso non ha ancora un profilo Black Market.</p><a class="btn gold" href="black-market.html">Completa la registrazione</a></section>');return}
  $('gate').hidden=true;$('main').hidden=false;
  await loadHome();
 }catch(e){
  if(/Modulo non attivo/i.test(String(e.message)))gateOff();
  else gate(`<section class="card sm-gate"><h2>Errore di collegamento</h2><p class="mute">${errTxt(e)}</p><button class="btn ghost" id="retry">Riprova</button></section>`)}}
boot();
if('serviceWorker' in navigator){/* registrato da tempio.js */}
window.__sim={get S(){return S},get LID(){return LID},CARDS:CARDS};
})();
</script></body></html>
