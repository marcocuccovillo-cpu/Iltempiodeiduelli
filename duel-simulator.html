/* ===== tavolo ===== */

.sm-sh .x{float:right;min-height:40px;min-width:40px;border-radius:10px;border:1px solid var(--line);background:none;color:var(--tx);font-size:1.2rem;cursor:pointer;margin:-4px 0 0 8px}
.sm-cinfo{display:grid;grid-template-columns:96px 1fr;gap:12px;margin:8px 0}
.sm-cinfo img{width:96px;height:140px;object-fit:cover;border-radius:6px;background:#111}
.sm-cinfo .ph{width:96px;height:140px;border-radius:6px}
.sm-cinfo p{margin:0 0 4px;font-size:.86rem;color:var(--mu)}.sm-cinfo p b{color:var(--tx)}
.sm-eff{max-height:150px;overflow-y:auto;font-size:.88rem;line-height:1.4;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--inp);white-space:pre-wrap;overflow-wrap:anywhere;margin:6px 0}
.sm-acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.sm-acts .btn{min-height:46px;font-size:.88rem;padding:0 8px;line-height:1.15;text-align:center}
.sm-acts .full{grid-column:1/-1}
.sm-acts h4{grid-column:1/-1;margin:6px 0 0;font:700 .76rem var(--ui);color:var(--mu);text-transform:uppercase;letter-spacing:.06em}
.sm-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}@media(min-width:420px){.sm-grid{grid-template-columns:repeat(5,1fr)}}
.sm-grid button{position:relative;padding:0;border:0;background:none;aspect-ratio:59/86;border-radius:5px;cursor:pointer}
.sm-grid .sm-cd{position:absolute;inset:0}
.sm-grid small{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.7);color:#fff;font:600 9px/1.3 var(--ui);padding:1px 2px;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border-radius:0 0 5px 5px}
.sm-lpb{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}.sm-lpb button{min-height:50px;border-radius:12px;border:1px solid var(--line);background:var(--surf);color:var(--tx);font:700 1.05rem var(--ui);cursor:pointer}
.sm-lpb button.m{color:var(--bad)}.sm-lpb button.p{color:var(--good)}
.sm-log{display:grid;gap:0;margin-top:8px}.sm-log div{padding:6px 0;border-top:1px solid var(--line);font-size:.88rem;line-height:1.35;overflow-wrap:anywhere}.sm-log div:first-child{border-top:0}.sm-log b{color:var(--ac2)}.sm-log small{color:var(--mu);margin-right:6px}
.sm-say{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:10px;position:sticky;bottom:0;background:var(--deep);padding-top:8px}
.sm-res{text-align:center;padding:8px 0}.sm-res h2{font-size:1.6rem;margin-bottom:6px}
.sm-toast{position:fixed;left:50%;bottom:calc(10px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:3000;max-width:min(92vw,560px);padding:10px 14px;border-radius:12px;background:#2a0f16;border:1px solid var(--bad);color:#ffd5db;font-weight:600;text-align:center}
.sm-toast.ok{background:#0e2a1d;border-color:var(--good);color:#c8f7df}
@media (prefers-reduced-motion:reduce){.sm-z.pick{animation:none}}
</style></head><body>

<main class="pg">
 <header><p class="kicker">Tavolo digitale</p><h1>Duel Simulator</h1></header>
 <p class="lead sm-intro">Gioca a Yu-Gi-Oh! 1 contro 1 con un amico, al meglio di 3 con il side deck. Usi lo stesso profilo del Black Market, ma il simulatore non assegna XP né BC e non tocca Ladder o taglie. Il database tiene nascosti la tua mano, il tuo deck e le carte coperte.</p>

const unknown=id=>({n:'Carta '+id,t:'',d:'',a:null,df:null,l:0,r:'',at:'',u:1});
const ci=id=>CARDS[id]||unknown(id);
const isMon=c=>/Monster/.test(c.t),isSpell=c=>c.t==='Spell Card',isTrap=c=>c.t==='Trap Card',isExtraT=c=>/Fusion|Synchro|XYZ|Link/i.test(c.t||''),isPend=c=>/Pendulum/.test(c.t||''),isField=c=>isSpell(c)&&c.r==='Field';
let needBusy=null;
async function need(codes){
 const miss=[...new Set(codes.filter(x=>x>0))].filter(i=>!CARDS[i]);if(!miss.length)return;
 const ok=async arr=>{const r=await fetch(API+'?id='+arr.join(','));if(!r.ok)throw new Error('http '+r.status);(await r.json()).data.forEach(keep)};
 for(let i=0;i<miss.length;i+=40){const part=miss.slice(i,i+40);
  try{await ok(part)}catch(e){for(const id of part){try{await ok([id])}catch(_){}}}}
 miss.forEach(i=>{if(!CARDS[i])CARDS[i]=unknown(i)});saveCards();

/* ---------- YDK ---------- */
function parseYdk(txt){const out={main:[],extra:[],side:[]};let sec='main';
 String(txt).split(/\r?\n/).forEach(r=>{const l=r.trim();if(!l)return;if(/^#main/i.test(l)){sec='main';return}if(/^#extra/i.test(l)){sec='extra';return}if(/^!side/i.test(l)){sec='side';return}if(l[0]==='#'||l[0]==='!')return;const id=+l;if(Number.isInteger(id)&&id>0)out[sec].push(id)});return out}
function expand(a){const o=[];(a||[]).forEach(c=>{for(let i=0;i<(c.qty||1);i++)o.push(+c.id)});return o}
function collapse(a){const m={};a.forEach(id=>{m[id]=(m[id]||0)+1});return Object.entries(m).map(([id,qty])=>({id:+id,qty}))}
function readAnalyzer(){try{const d=JSON.parse(localStorage.getItem(KD));if(d&&d.main&&(d.main.length||d.extra&&d.extra.length)){return{name:d.name||'Deck',main:expand(d.main),extra:expand(d.extra),side:expand(d.side)}}}catch(_){}return null}
function deckWarn(d){const w=[];if(d.main.length<40)w.push(`Main Deck di ${d.main.length} carte (servono almeno 40 per giocare)`);if(d.main.length>60)w.push(`Main Deck di ${d.main.length} carte (massimo 60)`);if(d.extra.length>15)w.push(`Extra Deck di ${d.extra.length} carte (massimo 15)`);if(d.side.length>15)w.push(`Side Deck di ${d.side.length} carte (massimo 15)`);
 const t={};[...d.main,...d.extra,...d.side].forEach(i=>{t[i]=(t[i]||0)+1});Object.entries(t).forEach(([i,q])=>{if(q>3)w.push(`${esc(ci(i).n)}: ${q} copie (massimo 3)`)});return w}

/* ---------- mappa del tavolo ---------- */
function board(){const M={},pile={gy:{1:[],2:[]},banish:{1:[],2:[]},extra:{1:[],2:[]}},ovl={};
 S.cards.forEach(c=>{
  if(c.z==='mz'||c.z==='st'||c.z==='fz')M[c.z+':'+c.c+':'+c.s]=c;
  else if(c.z==='emz')M['emz:0:'+c.s]=c;
  else if(c.z==='gy'||c.z==='banish'||c.z==='extra')pile[c.z][c.o].push(c);

function deckCardSheet(e,back,afterMove){const c={i:e.i,o:S.me.seat,c:S.me.seat,z:'deck',x:e.x,f:false};const info=ci(e.x),mon=isMon(info),items=[];const add=(l,fn,o)=>items.push(B_(l,fn,o)),head=h=>items.push({h});
 const go=(z,o)=>async()=>{o=Object.assign({shuffle:afterMove?false:null},o||{});await doMove(c.i,z,o);if(afterMove)afterMove(e)};
 head('Dal deck');add('In mano',go('hand'),'');
 if(mon){add('Evoca in attacco',go('mz',{pos:'atk',face:true}));add('Evoca in difesa',go('mz',{pos:'def',face:true}));add('Setta (coperta in difesa)',go('mz',{pos:'def',face:false}))}
 if(isSpell(info)||isTrap(info)){const fz=isField(info);add('Attiva (scoperta)',go(fz?'fz':'st',{face:true}));add('Setta (coperta)',go(fz?'fz':'st',{face:false}))}
 add('Nel Cimitero',go('gy'));add('Rimuovi dal gioco',go('banish',{face:true}));add('Rimuovi coperta',go('banish',{face:false}));
 const sh=sheet(`${xBtn(back)}<h3>${esc(info.n)}</h3>${infoBlock(e.x)}<div class="sm-acts">${bt(items)}</div>`,{label:info.n});SHOWN=null;
 sh.querySelectorAll('[data-sa]').forEach(b=>b.onclick=()=>act(b,async()=>{await items[+b.dataset.sa].fn()}))}

function zoneSheet(zone,slot){const me=S.me.seat,B=board(),hand=S.cards.filter(c=>c.z==='hand'&&c.o===me).sort((a,b)=>a.k-b.k);
 const srcs=[['hand','Dalla mano',hand],['gy','Dal Cimitero',B.pile.gy[me].slice().reverse()],['banish','Dalle carte rimosse',B.pile.banish[me].slice().reverse()],['extra','Dall’Extra Deck',B.pile.extra[me]]];
 const sh=sheet(`${xBtn()}<h3>${ZN[zone]} ${slot}</h3><p class="sm-sub">Scegli da dove prendere la carta.</p><div class="sm-acts">${srcs.map(s=>`<button class="btn ghost" data-src="${s[0]}" ${s[2].length?'':'disabled'}>${s[1]} (${s[2].length})</button>`).join('')}<button class="btn ghost full" data-src="deck">Dal deck (cerca)</button></div>`,{label:'Zona libera'});

/* ---------- eventi del tavolo ---------- */
function tableClick(t){
 const z=t.closest('[data-zone]');
 if(z){const zone=z.dataset.zone,side=+z.dataset.side,slot=+z.dataset.slot,B=board(),c=B.M[zone+':'+(zone==='emz'?0:side)+':'+slot];
  if(PICK){if(pickOk(zone,side,slot,c)){const p=PICK;PICK=null;act(null,async()=>{await p.cb(p.kind==='host'?c.i:slot)})}return}
  if(c){openCard(c);return}
  if(side===S.me.seat&&zone!=='emz'||zone==='emz'){zoneSheet(zone,slot)}return}
 const p=t.closest('[data-pile]');
 if(p){const kind=p.dataset.pile,side=+p.dataset.side;
  if(kind==='deck'){if(side===S.me.seat)deckMenu();else toast(`${nick(side)} ha ${(S.counts[side]||{}).deck||0} carte nel deck`,true);return}
  openPile(kind,side);return}
 const h=t.closest('[data-hand]');if(h){const c=S.cards.find(x=>x.i===+h.dataset.hand);if(c)openCard(c);return}
 const lp=t.closest('.sm-lp');if(lp){lpSheet(+lp.dataset.lp);return}
 const ph=t.closest('[data-ph]');if(ph){act(ph,async()=>{await call('sim_phase',{p_phase:ph.dataset.ph})});return}
 const a=t.closest('[data-a]');if(a){const k=a.dataset.a;
  if(k==='draw1')act(a,async()=>{await call('sim_draw',{p_n:1})});
  else if(k==='deckMenu')deckMenu();
  else if(k==='openLog')openLog();
  else if(k==='more')moreSheet();
  else if(k==='endTurn')act(a,async()=>{await call('sim_end_turn')});
  else if(k==='pickCancel'){PICK=null;render()}
  else if(k==='confirmEnd')act(a,async()=>{await call('sim_confirm_end')});
  else if(k==='dismissEnd')act(a,async()=>{await call('sim_dismiss_end')});
  else if(k==='accept')act(a,async()=>{await call('sim_respond',{p_accept:true})});
  else if(k==='decline'||k==='withdraw')act(a,async()=>{await call('sim_respond',{p_accept:false})})}}

function leaveFlow(btn){const st=S&&S.lobby.status;
 if(st==='playing'||st==='siding'){confirmSheet('Abbandonare l’incontro?','Perderai l’intero incontro e uscirai dalla partita.','Sì, abbandono',async()=>{await rpc('sim_lobby_leave',{p_lobby:LID});await loadState()});return}
 act(btn,async()=>{await rpc('sim_lobby_leave',{p_lobby:LID});LID=null;S=null;SDkey='';say('Sei uscito dalla lobby.');await loadHome()})}
async function goHome(){LID=null;S=null;SDkey='';PICK=null;SHOWN=null;closeSheet();document.body.classList.remove('sm-tbl-on');$('v').dataset.k='';await loadHome()}
function renameSheet(d){const sh=sheet(`${xBtn()}<h3>Rinomina il deck</h3><label for="rnN">Nome</label><input id="rnN" maxlength="40" value="${esc(d.name)}"><button class="btn block" id="rnGo" style="margin-top:10px">Salva</button>`,{label:'Rinomina'});
 $('rnGo').onclick=()=>act($('rnGo'),async()=>{await rpc('sim_deck_save',{p_id:d.id,p_name:$('rnN').value,p_main:d.main,p_extra:d.extra,p_side:d.side,p_temp:false});closeSheet();say('Deck rinominato.','good');await loadHome();if(LID)await loadState()})}

document.addEventListener('click',e=>{
 const t=e.target;if(!t.closest)return;
 const bg=t.closest('[data-ovbg]');if(bg&&t===bg){closeSheet();return}
 if(t.closest('[data-close]')){closeSheet();return}
 const bk=t.closest('[data-back]');if(bk&&NEXTBACKFN){const f=NEXTBACKFN;f();return}
 if(t.closest('#ov'))return;
 if(view==='table'&&t.closest('#v')){tableClick(t);return}
 const b=t.closest('button,label');if(!b)return;
 const id=b.id;
 if(id==='retry'){boot();return}
 if(id==='newL'){act(b,async()=>{LID=await rpc('sim_lobby_create',{p_title:($('newT').value||'').trim()||null});say('');await loadState()});return}
 if(b.dataset.join){act(b,async()=>{const l=+b.dataset.join;await rpc('sim_lobby_join',{p_lobby:l});LID=l;say('');await loadState()});return}
 if(b.dataset.dren){const d=HOME.decks.find(x=>x.id===b.dataset.dren);if(d)renameSheet(d);return}
 if(b.dataset.ddel){const d=HOME.decks.find(x=>x.id===b.dataset.ddel);if(d)confirmSheet('Eliminare il deck?',`Il deck <b>${esc(d.name)}</b> verrà cancellato dalla tua libreria.`,'Elimina',async()=>{await rpc('sim_deck_delete',{p_id:d.id});say('Deck eliminato.');await loadHome();if(LID)await loadState()});return}
 if(b.dataset.dan){const d=HOME.decks.find(x=>x.id===b.dataset.dan);if(d){try{localStorage.setItem(KD,JSON.stringify({name:d.name,main:collapse(d.main),extra:collapse(d.extra),side:collapse(d.side)}));localStorage.setItem(KSIM,d.id)}catch(_){}location.href='deck-analyzer.html'}return}
 if(id==='impAn'){const d=readAnalyzer();if(d)impStart(d);else say('Nel Deck Analyzer non c’è nessun deck.','bad');return}
 if(id==='impPaste'){const d=parseYdk(($('impTxt')||{}).value||'');if(d.main.length+d.extra.length+d.side.length===0){say('Non ho trovato nessuna carta: incolla il contenuto di un file .ydk.','bad');return}d.name='Deck incollato';impStart(d);return}
 if(id==='impCancel'){IMP=null;impPreview();return}
 if(id==='impSave'){act(b,()=>impSave(false));return}
 if(id==='impTemp'){act(b,()=>impSave(true));return}
 if(b.dataset.pick){act(b,async()=>{await rpc('sim_set_deck',{p_lobby:LID,p_deck:b.dataset.pick});await loadState()});return}
 if(id==='lbReady'||id==='sdReady'){act(b,async()=>{const r=!myP().ready;S=await rpc('sim_set_ready',{p_lobby:LID,p_ready:r});needThen(codesOf(S));render()});return}
 if(id==='lbStart'){act(b,async()=>{S=await rpc('sim_start',{p_lobby:LID});render()});return}
 if(id==='lbKick'){act(b,async()=>{S=await rpc('sim_lobby_kick',{p_lobby:LID});render()});return}
 if(id==='lbLeave'){leaveFlow(b);return}
 if(b.dataset.first){act(b,async()=>{S=await rpc('sim_choose_first',{p_lobby:LID,p_first:+b.dataset.first});needThen(codesOf(S));render()});return}
 if(b.dataset.sd){const[from,to,cid]=b.dataset.sd.split(':'),c=+cid,i=SD[from].indexOf(c);if(i>=0){SD[from].splice(i,1);SD[to].push(c);renderSiding()}return}
 if(id==='sdReset'){SD={main:[...S.me.cfg.main],extra:[...S.me.cfg.extra],side:[...S.me.cfg.side]};renderSiding();return}
 if(id==='sdApply'){act(b,async()=>{S=await rpc('sim_side',{p_lobby:LID,p_main:SD.main,p_extra:SD.extra,p_side:SD.side});SDkey='';say('Side applicato.','good');render()});return}
 if(id==='backHome'){goHome();return}
});
document.addEventListener('change',e=>{const f=e.target;if(f&&f.id==='impFile'&&f.files&&f.files[0]){const file=f.files[0];file.text().then(txt=>{const d=parseYdk(txt);if(d.main.length+d.extra.length+d.side.length===0){say('Il file non contiene carte: serve un .ydk valido.','bad');return}d.name=file.name.replace(/\.(ydk|txt)$/i,'')||'Deck';impStart(d)});f.value=''}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&sheetOpen())closeSheet();if((e.key==='Enter'||e.key===' ')&&e.target&&e.target.classList&&e.target.classList.contains('sm-last')){e.preventDefault();openLog()}});
window.addEventListener('resize',()=>{if(view==='table'&&S)render()});


async function boot(){
 if(!window.supabase){gate('<section class="card sm-gate"><h2>Collegamento non riuscito</h2><p class="mute">Impossibile caricare la libreria di accesso. Controlla la connessione e riprova.</p><button class="btn ghost" id="retry">Riprova</button></section>');return}
 try{
  if(!sb){sb=window.supabase.createClient(new URL(SUPABASE_URL).origin,SUPABASE_ANON_KEY,{auth:{persistSession:true,autoRefreshToken:true}});
   sb.auth.onAuthStateChange(ev=>{if(ev==='SIGNED_OUT')gateLogin()})}
  const{data:{session}}=await sb.auth.getSession();
  if(!session){gateLogin();return}
  ME=session.user.id;
  const pr=await sb.from('profiles').select('id').eq('id',ME).maybeSingle();
  if(!pr.data){gate('<section class="card sm-gate"><h2>Completa il profilo</h2><p class="mute">Il tuo accesso non ha ancora un profilo Black Market.</p><a class="btn gold" href="black-market.html">Completa la registrazione</a></section>');return}
  $('gate').hidden=true;$('main').hidden=false;
  await loadHome();
 }catch(e){
  if(/Modulo non attivo/i.test(String(e.message)))gateOff();
  else gate(`<section class="card sm-gate"><h2>Errore di collegamento</h2><p class="mute">${errTxt(e)}</p><button class="btn ghost" id="retry">Riprova</button></section>`)}}
boot();
if('serviceWorker' in navigator){/* registrato da tempio.js */}
window.__sim={get S(){return S},get LID(){return LID},CARDS:CARDS};
})();
</script></body></html>
