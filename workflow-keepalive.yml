# Sveglia Supabase ogni 3 giorni, così il piano gratuito non va in pausa per inattività.
# Servono due "secrets" nel repository: SUPABASE_URL e SUPABASE_ANON_KEY (Settings > Secrets and variables > Actions).
name: Supabase keepalive
on:
  schedule:
    - cron: '17 6 */3 * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Chiama la funzione ping
        run: |
          curl -fsS -X POST "${{ secrets.SUPABASE_URL }}/rest/v1/rpc/ping" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Content-Type: application/json" -d '{}'
