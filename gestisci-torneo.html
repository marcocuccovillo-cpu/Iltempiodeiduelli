<script>
TM.mount();if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
(function(){
const K='tempio.torneo.v1',$=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let T=null;try{T=JSON.parse(localStorage.getItem(K))}catch(e){}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(T))}catch(e){}};
const enc=o=>'TD1:'+btoa(unescape(encodeURIComponent(JSON.stringify(o))));
const suggest=n=>n<=8?3:n<=16?4:n<=32?5:n<=64?6:n<=128?7:8;
function calc(){const s=T.players.map(p=>({id:p.id,name:p.name,drop:p.drop,pts:0,w:0,l:0,pl:0,wn:0,opp:[],bye:0}));
 T.rounds.forEach(r=>r.forEach(m=>{if(m.b==null){const a=s[m.a];a.pts+=3;a.w++;a.bye++;return}if(!m.res)return;const a=s[m.a],b=s[m.b];a.pl++;b.pl++;a.opp.push(m.b);b.opp.push(m.a);
  if(m.res=='A'){a.pts+=3;a.w++;b.l++;a.wn++}else if(m.res=='B'){b.pts+=3;b.w++;a.l++;b.wn++}else{a.l++;b.l++}}));
 s.forEach(x=>x.mw=x.pl?Math.max(1/3,x.wn/x.pl):1/3);
 s.forEach(x=>x.omw=x.opp.length?x.opp.reduce((t,o)=>t+s[o].mw,0)/x.opp.length:0);return s}
const order=a=>a.slice().sort((x,y)=>y.pts-x.pts||y.omw-x.omw||x.name.localeCompare(y.name));
function pairRound(){const s=calc();let pool=T.players.filter(p=>!p.drop).map(p=>s[p.id]);
 if(!T.rounds.length)pool.sort(()=>Math.random()-.5);else pool=order(pool);
 let bye=null;if(pool.length%2){for(let i=pool.length-1;i>=0;i--)if(!pool[i].bye){bye=pool[i];break}if(!bye)bye=pool[pool.length-1];pool=pool.filter(x=>x!==bye)}
 let nodes=0;const dfs=(l,strict)=>{if(!l.length)return[];if(++nodes>30000)return null;const a=l[0];
  for(let j=1;j<l.length;j++){const b=l[j];if(strict&&a.opp.includes(b.id))continue;const r=dfs(l.filter((_,k)=>k&&k!==j),strict);if(r)return[[a,b],...r];if(nodes>30000)return null}return null};
 let pairs=T.avoid?dfs(pool,true):null;nodes=0;if(!pairs)pairs=dfs(pool,false)||[];
 const ms=pairs.map(([a,b])=>({a:a.id,b:b.id,res:null}));if(bye)ms.push({a:bye.id,b:null,res:'A'});T.rounds.push(ms)}
function startCut(){const o=order(calc().filter(x=>!x.drop)).slice(0,T.cut);T.seeds=o.map(x=>x.id);
 const ix=T.cut==4?[[0,3],[1,2]]:[[0,7],[3,4],[1,6],[2,5]];T.cutR=[ix.map(([i,j])=>({a:T.seeds[i],b:T.seeds[j],res:null}))];T.phase='cut'}
function nextCut(){const last=T.cutR[T.cutR.length-1],w=last.map(m=>m.res=='A'?m.a:m.b);if(w.length==1){T.phase='done';return}
 const nx=[];for(let i=0;i<w.length;i+=2)nx.push({a:w[i],b:w[i+1],res:null});T.cutR.push(nx)}
function finalRank(){const s=order(calc());if(!(T.cutR&&T.cutR.length))return s.map(x=>x.id);
 const rank=[],used=new Set(),add=id=>{if(id!=null&&!used.has(id)){used.add(id);rank.push(id)}};
 const f=T.cutR[T.cutR.length-1][0];if(f.res){add(f.res=='A'?f.a:f.b);add(f.res=='A'?f.b:f.a)}
 for(let r=T.cutR.length-2;r>=0;r--)T.cutR[r].map(m=>m.res?(m.res=='A'?m.b:m.a):null).filter(x=>x!=null).sort((x,y)=>T.seeds.indexOf(x)-T.seeds.indexOf(y)).forEach(add);
 s.forEach(x=>add(x.id));return rank}
const nm=id=>esc(T.players[id].name),pct=x=>(x*100).toFixed(1)+'%';
const cutName=n=>n==4?'Quarti di finale':n==2?'Semifinali':'Finale';
function matchHTML(m,i,cut){if(m.b==null)return`<div class="bye">Bye: <b>${nm(m.a)}</b> (vittoria assegnata)</div>`;
 const p=v=>m.res==v?'true':'false';
 return`<div class="m"><div class="mt">${cut?'Match':'Tavolo'} ${i+1}</div><div class="mm"><button data-act="r" data-m="${i}" data-v="A" aria-pressed="${p('A')}">${nm(m.a)}</button>${cut?'<span class="mute" style="align-self:center">vs</span>':`<button class="dl" data-act="r" data-m="${i}" data-v="DL" aria-pressed="${p('DL')}" title="Doppia sconfitta">Doppia sconfitta</button>`}<button data-act="r" data-m="${i}" data-v="B" aria-pressed="${p('B')}">${nm(m.b)}</button></div></div>`}
function render(){const A=$('app');
 if(!T||T.phase=='setup'){A.innerHTML=`<section class="card g2" style="margin-top:24px"><div><label for="tn">Nome del torneo</label><input id="tn" value="${esc(T?.name||'')}" placeholder="Es. Torneo del venerdì"></div><div><label for="td">Data</label><input id="td" type="date" value="${new Date().toISOString().slice(0,10)}"></div>
  <div style="grid-column:1/-1"><label for="names">Giocatori (uno per riga)</label><textarea id="names" rows="7" placeholder="Marco&#10;Elisa&#10;Kevin"></textarea><p class="mute" id="cnt" style="margin:4px 0 0">0 giocatori</p></div>
  <div><label for="rn">Turni Swiss</label><input id="rn" type="number" min="1" max="12" value="3"></div>
  <div><label for="cut">Fase finale</label><select id="cut"><option value="0">Nessuna</option><option value="4">Top 4</option><option value="8">Top 8</option></select></div>
  <label style="display:flex;align-items:center;gap:10px;margin:0"><input id="av" type="checkbox" checked style="width:22px;min-height:0;accent-color:var(--red)"> Evita rematch</label>
  <div class="row" style="justify-content:flex-end"><button class="btn ghost" data-act="ex">Carica esempio</button><button class="btn" data-act="start">Inizia torneo</button></div><p class="mute" id="err" role="alert" style="grid-column:1/-1;margin:0"></p></section>`;
  const names=$('names'),rn=$('rn');let touched=false;rn.oninput=()=>touched=true;
  names.oninput=()=>{const n=names.value.split('\n').filter(x=>x.trim()).length;$('cnt').textContent=n+' giocatori';if(!touched&&n)rn.value=suggest(n);
   [...$('cut').options].forEach(o=>{if(+o.value)o.disabled=n<+o.value*1});if($('cut').selectedOptions[0]?.disabled)$('cut').value='0'};
  names.oninput();return}
 const s=calc(),ord=order(s),rk=ord.map(x=>x.id),fin=T.phase=='done';
 let h=`<div class="row" style="justify-content:space-between;margin-top:22px"><div><h2 style="font-size:1.6rem">${esc(T.name||'Torneo')}</h2><span class="mute">${T.date} · ${T.players.length} giocatori · ${T.total} turni${T.cut?' + Top '+T.cut:''}</span></div><button class="btn ghost sm" data-act="new">Nuovo torneo</button></div>`;
 if(fin){const r=finalRank();h+=`<section class="card sec"><p class="kicker">Torneo concluso</p><div class="win">${nm(r[0])}</div><p class="mute" style="margin:4px 0 0">Campione del ${esc(T.name||'torneo')}</p>
  <div class="row" style="margin-top:14px"><button class="btn sm" data-act="copy">Copia classifica</button><button class="btn ghost sm" data-act="code">Codice per il Sentiero</button></div>
  <p class="mute" style="margin:10px 0 0">Il “codice” si manda ai giocatori su WhatsApp: lo incollano ne Il Sentiero (scheda Libretto, “Importa un codice”) e il torneo entra nel loro Campionato.</p><pre id="codeOut" style="white-space:pre-wrap;word-break:break-all;font-size:.8rem" hidden></pre></section>
  <section class="sec"><h2>Classifica finale</h2><div class="scroll"><table><thead><tr><th>#</th><th>Giocatore</th></tr></thead><tbody>${r.map((id,i)=>`<tr><td>${i+1}</td><td>${nm(id)}</td></tr>`).join('')}</tbody></table></div></section>`}
 else{const cutPh=T.phase=='cut',R=cutPh?T.cutR:T.rounds,cr=R[R.length-1],done=cr.every(m=>m.b==null||m.res),idx=cr.map((m,i)=>[m,i]);
  const title=cutPh?cutName(cr.length):`Turno ${T.rounds.length} di ${T.total}`;
  const last=!cutPh&&T.rounds.length>=T.total,pend=cr.filter(m=>m.b!=null&&!m.res).length;
  h+=`<section class="sec"><h2>${title}</h2><p class="mute" style="margin:0 0 8px">${pend?pend+(pend==1?' risultato da inserire':' risultati da inserire'):'Tutti i risultati inseriti'} · doppia sconfitta = 0 punti a entrambi</p>${idx.filter(([m])=>m.b!=null).map(([m,i])=>matchHTML(m,i,cutPh)).join('')}${idx.filter(([m])=>m.b==null).map(([m,i])=>matchHTML(m,i,cutPh)).join('')}
  <div class="row" style="margin-top:14px">${cutPh?`<button class="btn" data-act="nextcut" ${done?'':'disabled'}>${cr.length==1?'Concludi torneo':'Prossimo turno finale'}</button>`:last?`<button class="btn" data-act="finish" ${done?'':'disabled'}>${T.cut?'Passa alla fase finale':'Concludi torneo'}</button>`:`<button class="btn" data-act="next" ${done?'':'disabled'}>Genera turno ${T.rounds.length+1}</button>`}</div></section>`}
 if(!(fin&&0)){h+=`<section class="sec"><h2>Classifica Swiss</h2><div class="scroll"><table><thead><tr><th>#</th><th>Giocatore</th><th>Pt</th><th>V-S</th><th>OMW%</th>${fin?'':'<th></th>'}</tr></thead><tbody>${ord.map((x,i)=>`<tr class="${x.drop?'drop':''}"><td>${i+1}</td><td>${nm(x.id)}${x.drop?' <span class="chip">drop</span>':''}</td><td><b>${x.pts}</b></td><td>${x.w}-${x.l}</td><td>${pct(x.omw)}</td>${fin?'':`<td><button class="btn ghost sm" data-act="drop" data-p="${x.id}">${x.drop?'Rientra':'Drop'}</button></td>`}</tr>`).join('')}</tbody></table></div><p class="mute" style="margin-top:8px">Spareggio: punti, poi OMW% (minimo 33,3%).</p></section>`}
 const past=T.rounds.slice(0,fin||T.phase=='cut'?T.rounds.length:T.rounds.length-1);
 if(past.length)h+=`<section class="sec"><h2>Turni precedenti</h2>${past.map((r,i)=>`<details><summary>Turno ${i+1}</summary>${r.map(m=>m.b==null?`<div class="it">${nm(m.a)} <span class="chip">bye</span></div>`:`<div class="it"><span>${nm(m.a)} vs ${nm(m.b)}</span><span class="chip">${m.res=='A'?nm(m.a)+' vince':m.res=='B'?nm(m.b)+' vince':'doppia sconfitta'}</span></div>`).join('')}</details>`).join('')}</section>`;
 A.innerHTML=h}
$('app').onclick=e=>{const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act;
 if(a=='ex'){$('names').value='Marco\nElisa\nKevin\nJaafar\nGadaleta\nSofia\nLuca\nAnna\nDavide\nChiara';$('names').oninput();return}
 if(a=='start'){const L=$('names').value.split('\n').map(x=>x.trim()).filter(Boolean),u=new Set(L.map(x=>x.toLowerCase()));
  if(L.length<2){$('err').textContent='Servono almeno 2 giocatori.';return}if(u.size!=L.length){$('err').textContent='Ci sono nomi duplicati: aggiungi un’iniziale per distinguerli.';return}
  const cut=+$('cut').value;T={phase:'swiss',name:$('tn').value.trim(),date:$('td').value,players:L.map((n,i)=>({id:i,name:n,drop:false})),total:Math.max(1,Math.min(12,+$('rn').value||3)),cut:cut&&L.length>=cut?cut:0,avoid:$('av').checked,rounds:[]};pairRound();save();render();return}
 if(a=='r'){const R=T.phase=='cut'?T.cutR:T.rounds,m=R[R.length-1][+b.dataset.m],v=b.dataset.v;m.res=m.res==v?null:v;save();render();return}
 if(a=='next'){pairRound();save();render();scrollTo(0,0);return}
 if(a=='finish'){if(T.cut)startCut();else T.phase='done';save();render();scrollTo(0,0);return}
 if(a=='nextcut'){nextCut();save();render();scrollTo(0,0);return}
 if(a=='drop'){const p=T.players[+b.dataset.p];p.drop=!p.drop;save();render();return}
 if(a=='new'){if(confirm('Chiudere questo torneo e iniziarne uno nuovo? I dati attuali andranno persi.')){T=null;localStorage.removeItem(K);render()}return}
 if(a=='copy'){const r=finalRank(),s=calc(),t=`${T.name||'Torneo'} — ${T.date}\n`+r.map((id,i)=>`${i+1}. ${T.players[id].name} (${s[id].pts} pt)`).join('\n');
  navigator.clipboard.writeText(t).then(()=>{b.textContent='Copiato!'}).catch(()=>{});return}
 if(a=='code'){const c=enc({k:'tourn',id:'t'+T.date+(T.name||'').replace(/\W/g,'').slice(0,8),name:T.name||'Torneo',date:T.date,rank:finalRank().map(id=>T.players[id].name)});
  const o=$('codeOut');o.textContent=c;o.hidden=false;navigator.clipboard.writeText(c).then(()=>{b.textContent='Codice copiato!'}).catch(()=>{})}};
render();
})();
